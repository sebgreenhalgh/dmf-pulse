temporal_policy:
  synthetic_replay: >-
    Processing time is explicit, deterministic, scenario-derived, and retained across resume
    and concurrency. Host wall-clock time is not a semantic replay input.
  ordinary_manual_live: >-
    Actual receipt and processing availability remain controlling; an earlier claimed captured
    timestamp cannot make information processed after cutoff eligible.
  forbidden_global_change: >-
    Never replace ordinary operation time with captured_at, ignore the injected real clock for
    every mode, relax cutoff eligibility, or downgrade POST_CUTOFF to a warning.

