objective: >-
  Repair the inherited host-wall-clock dependency in authorized synthetic FPL replay and
  resume so that a frozen historical scenario remains deterministic across execution dates,
  while preserving strict real processing-time cutoff, rights, quarantine, and POST_CUTOFF
  behavior for ordinary/manual/live ingestion.

user_visible_vertical_slice:
  command: >-
    dmf ingest fpl replay --fixture-set fixtures/fpl/FPL-004 --scenario happy_path
    --information-cutoff 2026-08-21T17:30:00Z --rights-profile synthetic_test_v1
    --output json
  expected: >-
    The authorized synthetic happy path produces its source bundle and exits zero regardless
    of the later host calendar date; the frozen post_cutoff scenario remains observed but
    ineligible, and ordinary/manual/live processing cannot backdate usable information.

