expected_branch: "stage/A10/OPT-010-one-gameweek-optimiser"
inherited_alembic_head: "20260807_0006"
proposed_alembic_revision: null

objective: >-
  Consume one accepted coherent Stage-9 Gameweek projection and a complete governed
  manager-tactics rules view, then exhaust the declared bounded search scope and return the
  exact legal squad, XI, bench goalkeeper, ordered outfield bench, captain and vice that
  maximises EXPECTED_CURRENT_GAMEWEEK_MANAGER_POINTS, or a typed fail-closed result.

objective_limitations:
  - "Bounded Stage-10 proof objective only."
  - "Not the eventual rolling-horizon remaining-season objective."
  - "Not rank-aware, price-forecast-aware or chip-aware."
  - "No manager account, transfer state, recourse or execution action."

user_visible_vertical_slice:
  optimise_command: >-
    dmf optimise one-gameweek --request <request.json> --gameweek-artifact
    <stage9-gameweek.json> --ruleset <compiled-ruleset.json> [--capability
    <capability.json>] --artifact-root <directory> --output json
  validate_command: >-
    dmf optimise validate-plan --request <request.json> --gameweek-artifact
    <stage9-gameweek.json> --ruleset <compiled-ruleset.json> [--capability
    <capability.json>] --artifact <one-gameweek-result.json> --output json
  expected: >-
    Offline canonical JSON with verified input/result lineage, a legal exact plan only when
    complete exhaustion and every upstream/rules gate pass, deterministic solver evidence,
    scenario-native manager scores and structured explanations.

