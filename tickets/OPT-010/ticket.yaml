gate0_rulings:
  G0-1_fixed_squad:
    decision: "APPROVED"
    contract: >-
      FIXED_SQUAD is exactly 15 supplied canonical player IDs and is a stateless tactical
      candidate only. It has no manager, price, bank, free-transfer, history, transfer-action
      or no-transfer economic meaning.
    supported_search_scopes:
      - "FIXED_SQUAD"
      - "PROVIDED_SQUADS"
      - "BOUNDED_PLAYER_POOL"
  G0-2_production_capability:
    decision: "FULL_SEASON_REQUIRED_CONSERVATIVELY"
    contract: >-
      Do not create a capability. Production requires a canonical FULL_SEASON capability
      artifact recomputed from the exact compiled ruleset, source_backed=true,
      production_eligible=true and blockers empty. This is intentionally over-restrictive.
      PLAYER_POINTS and every narrower existing capability are insufficient.
    current_target_result:
      status: "BLOCKED"
      error_code: "MANAGER_TACTICS_CAPABILITY_UNAVAILABLE"
      recommended_plan: null
    production_gate_order:
      - "Verify request, Stage-9 artifact, compiled-rules and optional capability integrity."
      - >-
        Recompute and evaluate FULL_SEASON; any absent, wrong-scope, noncanonical, non-source-backed,
        non-production-eligible or blocked artifact returns MANAGER_TACTICS_CAPABILITY_UNAVAILABLE.
      - >-
        Only after FULL_SEASON passes, require independently provable Stage-9 cutoff lineage;
        absence returns STAGE9_CUTOFF_LINEAGE_UNAVAILABLE.
  G0-3_test_replay_rules:
    decision: "COMPILED_RULESET_ONLY"
    contract: >-
      TEST/REPLAY accepts only a complete integrity-checked REFERENCE_ONLY or test-synthetic
      compiled ruleset. Requests contain no rule constants. Golden semantics are frozen in
      this ticket and tickets/OPT-010/ACCEPTANCE.md and are never claimed as 2026/27 rules.
  G0-4_search:
    decision: "EXACT_BOUNDED_EXHAUSTIVE_ONLY"
    full_universe_supported: false
    pyomo_highs: false
    heuristic_pruning: false
  G0-5_caps:
    decision: "PACKAGED_POLICY_V1"
    objective_tolerance: null
    wall_clock_acceptance_threshold: null
  G0-6_resource_limit:
    decision: "NO_RECOMMENDATION_OR_INCUMBENT"
  G0-7_cli:
    decision: "EXPLICIT_OFFLINE_ARTIFACT_PATHS"
    gameweek_id_resolver: false
  G0-8_monte_carlo:
    PASS: "Eligible for exact search subject to every other gate."
    CONTINUE: >-
      Return BLOCKED with UPSTREAM_MONTE_CARLO_CONTINUE before search, preserve upstream status
      and reasons, guarantee NONE, and expose no plan, ties or conditional diagnostic incumbent.
    BLOCKED: >-
      Return BLOCKED with UPSTREAM_MONTE_CARLO_BLOCKED before search, preserve upstream status
      and reasons, guarantee NONE, and expose no plan or ties.
  G0-9_objective:
    decision: "EXPECTED_CURRENT_GAMEWEEK_MANAGER_POINTS"
  G0-10_baseline:
    decision: "NO_SEMANTIC_BASELINE"
    test_comparator: "A named synthetic/reference tactical comparator may exist only in tests."
  G0-11_budget:
    decision: "INITIAL_SQUAD_SELECTION_COST_ONLY"
    contract: >-
      BOUNDED_PLAYER_POOL uses initial_budget_tenths from the compiled rules view and requires
      every candidate's initial_selection_cost_tenths. FIXED_SQUAD and PROVIDED_SQUADS ignore
      and must not report cost/budget fields. No request-supplied budget, bank, purchase price,
      selling price or current-manager affordability exists.
  G0-12_stage9_cutoff:
    decision: "NO_STAGE9_CONTRACT_CHANGE_AND_PRODUCTION_FAIL_CLOSED"
    contract: >-
      Bind only the lineage actually present in GameweekProjectionResult. After the production
      FULL_SEASON gate passes, absence of independently provable Gameweek cutoff/projection-mode
      lineage returns BLOCKED with STAGE9_CUTOFF_LINEAGE_UNAVAILABLE and no plan. Any Stage-9
      extension is a separate ticket.

reference_test_rules:
  lifecycle: "REFERENCE_ONLY or TEST-synthetic; never production"
  source_basis:
    - "fixtures/rules/RUL-002/reference_2025_26/positions.yaml"
    - "fixtures/rules/RUL-002/reference_2025_26/squad.yaml"
    - "fixtures/rules/RUL-002/reference_2025_26/lineup.yaml"
    - "DMFP-02 sections 16.1 through 16.8"
  frozen_values:
    squad_size: 15
    squad_positions: {GK: 2, DEF: 5, MID: 5, FWD: 3}
    initial_budget_tenths: 1000
    max_per_club: 3
    starting_size: 11
    bench_size: 4
    formation_minimums: {GK: 1, DEF: 3, MID: 2, FWD: 1}
    formation_maximums: {GK: 1, DEF: 5, MID: 5, FWD: 3}
    captain_multiplier: 2
    vice_fallback: true
    automatic_substitutions:
      evaluation_scope: "AFTER_ALL_GAMEWEEK_FIXTURES"
      absent_definition: "ZERO_OFFICIAL_APPEARANCE_MINUTES"
      goalkeeper_replacement: "DESIGNATED_BENCH_GOALKEEPER_IF_APPEARED"
      outfield_order: "MANAGER_BENCH_ORDER"
      maintain_legal_formation: true
  test_only_multiple_absence_resolution: >-
    Choose the maximum-cardinality formation-feasible subset of appearing outfield substitutes;
    among equal cardinality choose the lexicographically greatest bench-inclusion vector so
    slot 1 outranks slot 2 and slot 2 outranks slot 3. Pair selected incoming players with the
    lexicographically smallest formation-feasible tuple of absent starters for audit output.
    This resolves only the frozen reference/test fixture and is not a 2026/27 production claim.

search_contract:
  backend: "DETERMINISTIC_EXHAUSTIVE_ENUMERATOR"
  guarantees:
    FIXED_SQUAD: "EXACT_FIXED_SQUAD"
    PROVIDED_SQUADS: "EXACT_PROVIDED_SET"
    BOUNDED_PLAYER_POOL: "EXACT_DECLARED_PLAYER_POOL"
  success_requires:
    - "The conservative preflight is within every packaged cap."
    - "The complete declared scope is exhausted."
    - "Every selected and returned tied plan passes the independent legality validator."
    - "Upstream Monte Carlo status is PASS and all rules/integrity gates pass."
  tie_order: >-
    Compare exact Decimal-from-canonical-float-token weighted integer-score numerators with no
    tolerance; only exact equality is a tie. Choose by (sorted squad, sorted XI, bench
    goalkeeper, ordered outfield bench, captain, vice).
  preflight: >-
    Compute squad count, exact rules-derived tactical count and tactical count multiplied by
    Stage-9 scenario count with Python integers before generating combinations. Do not use
    club/budget filtering to lower the conservative bounded-player-pool squad upper bound.
  failure: >-
    Any exceeded cap returns RESOURCE_LIMIT, guarantee NONE, no recommended_plan, no returned
    ties and no incumbent before enumeration starts.

packaged_policy:
  schema_version: "one-gameweek-optimiser-policy-v1"
  config_path: "config/optimisation/one_gameweek.yaml"
  package_path: "src/dmf_pulse/optimisation/resources/one_gameweek.yaml"
  byte_identical: true
  max_squad_candidates: 12
  max_tactical_configurations: 5000000
  max_scenario_score_operations: 20000000
  max_returned_ties: 16
  objective_tolerance: null
  rationale: >-
    Under the frozen reference 2/5/5/3 squad, all legal XI, six outfield bench orders and 110
    captain/vice pairs total 363,000 tactical configurations per squad. Twelve complete squads
    need 4,356,000 configurations; the four-scenario acceptance fixture needs 17,424,000 score
    operations. The rounded caps admit that proof fixture with bounded headroom, block a 13th
    declared squad at the squad cap and prevent accidental full-universe expansion. Wall-clock
    time is telemetry only.

