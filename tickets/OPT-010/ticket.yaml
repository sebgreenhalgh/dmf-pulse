stage: "A10"
title: "Exact bounded one-Gameweek squad and tactical optimiser"
status: "READY"
owner: "Sebastian Greenhalgh"
implementer_role: "Luna implementation worker"
reviewer_role: "fresh independent review and human acceptance"
gate0_frozen_on: "2026-08-15"

