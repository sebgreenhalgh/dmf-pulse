status_contract:
  SUCCESS:
    exit_code: 0
    plan: "required"
    guarantee: "one exact guarantee matching declared scope"
  BLOCKED:
    exit_code: 3
    plan: null
    guarantee: "NONE"
  INFEASIBLE:
    exit_code: 4
    plan: null
    guarantee: "NONE"
  RESOURCE_LIMIT:
    exit_code: 5
    plan: null
    guarantee: "NONE"
  invalid_input_or_integrity:
    exit_code: 2
    plan: null
  stable_error_codes:
