[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dmf-pulse"
dynamic = ["version"]
description = "Governed foundation for the private DMF Pulse decision engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Greenhalgh" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "alembic==1.18.5",
  "pydantic>=2,<3",
  "psycopg[binary]==3.3.4",
  "PyYAML>=6,<7",
  "SQLAlchemy==2.0.51",
  "typer>=0.12,<1",
]

[project.scripts]
dmf = "dmf_pulse.cli.app:main"

[dependency-groups]
dev = [
  "build>=1,<2",
  "coverage>=7,<8",
  "hatchling>=1.27,<2",
  "hypothesis>=6,<7",
  "mypy>=1,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.version]
path = "src/dmf_pulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dmf_pulse"]

[tool.hatch.build.targets.wheel.force-include]
"config/providers/fpl.json" = "dmf_pulse/ingestion/resources/fpl.json"
"config/rights/fpl_profiles.json" = "dmf_pulse/ingestion/resources/fpl_profiles.json"
"config/providers/the_odds_api.json" = "dmf_pulse/ingestion/resources/the_odds_api.json"
"config/rights/odds_profiles.json" = "dmf_pulse/ingestion/resources/odds_profiles.json"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
warn_unreachable = true
files = ["src/dmf_pulse"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
markers = [
  "unit: isolated unit test",
  "property: deterministic property-based test",
  "integration: cross-boundary integration test",
  "golden: stable serialized contract test",
  "postgres: requires disposable PostgreSQL 18.4",
  "migration: exercises Alembic upgrade/downgrade behavior",
  "contract: validates frozen public or provider contracts",
  "security: validates rights, retention, path, and disclosure boundaries",
]

[tool.coverage.run]
branch = true
source = ["dmf_pulse"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
