name: dmf-pulse-dat003

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: dmf_pulse_test
      POSTGRES_USER: dmf_test
      POSTGRES_PASSWORD: changeme
    ports:
      - "127.0.0.1:${DMF_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmf_test -d dmf_pulse_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dat003-postgres:/var/lib/postgresql

volumes:
  dat003-postgres:
