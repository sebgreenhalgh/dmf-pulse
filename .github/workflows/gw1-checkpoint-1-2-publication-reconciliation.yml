name: gw1-checkpoint-1-2-publication-reconciliation

on:
  push:
    branches:
      - recovery/GW1-checkpoint-1-2-publish
    paths:
      - .github/workflows/gw1-checkpoint-1-2-publication-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish workflow run identifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dmf-pulse-gw1-reconciliation-bot'
          git config user.email 'dmf-pulse-gw1-reconciliation-bot@users.noreply.github.com'
          mkdir -p .recovery/gw1-checkpoint-1-2-package
          printf '%s\n' "$GITHUB_RUN_ID" > .recovery/gw1-checkpoint-1-2-package/RUN_ID.txt
          git add .recovery/gw1-checkpoint-1-2-package/RUN_ID.txt
          git commit -m "chore(gw1): record reconciliation workflow run $GITHUB_RUN_ID"
          git push origin 'HEAD:refs/heads/recovery/GW1-checkpoint-1-2-publish'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frozen development environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv sync --all-groups --frozen

      - name: Validate and publish Checkpoint 1.2
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/gw1-checkpoint-1-2-package/part-*.b64 \
            | base64 --decode > /tmp/gw1-checkpoint-1-2-package.tar.gz
          echo 'fe83533b55417f3c88bdac04780b383339f7da97137c5fd80562e34533d47ec6  /tmp/gw1-checkpoint-1-2-package.tar.gz' \
            | sha256sum --check --strict
          mkdir -p /tmp/gw1-checkpoint-1-2-package
          tar -xzf /tmp/gw1-checkpoint-1-2-package.tar.gz \
            -C /tmp/gw1-checkpoint-1-2-package
          python - <<'PYFIX'
          from pathlib import Path

          path = Path('/tmp/gw1-checkpoint-1-2-package/publish.sh')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "assert value['status'] == 'PASS'": "assert value['status'] == 'VALID_WITH_WARNINGS'",
              "assert value['target_deadline'] == '2026-08-21T17:30:00Z'": "assert value['deadline_at'] == '2026-08-21T17:30:00Z'",
              "assert value['database_opened'] is False": "assert value['database_accessed'] is False",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected publication harness text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PYFIX
          bash /tmp/gw1-checkpoint-1-2-package/publish.sh
