name: rules-readiness-apply-payload

on:
  push:
    branches:
      - readiness/RUL-2026-27-full-season-activation
    paths:
      - automation/rules-readiness-payload.tar.gz.b64

permissions:
  contents: write

concurrency:
  group: rules-readiness-apply-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact payload commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and safely apply payload
        shell: bash
        run: |
          set -euo pipefail
          payload=automation/rules-readiness-payload.tar.gz.b64
          test -s "$payload"
          base64 --decode "$payload" > "$RUNNER_TEMP/rules-readiness-payload.tar.gz"
          python - "$RUNNER_TEMP/rules-readiness-payload.tar.gz" <<'PY'
          from __future__ import annotations
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path.cwd().resolve()
          with tarfile.open(archive, "r:gz") as tar:
              members = tar.getmembers()
              if not members:
                  raise SystemExit("empty payload")
              for member in members:
                  name = pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"unsafe payload path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsupported payload member: {member.name}")
              tar.extractall(root, members=members, filter="data")
          PY
          test -s .rules-readiness-commit-message
          commit_message="$(cat .rules-readiness-commit-message)"
          rm -f .rules-readiness-commit-message "$payload"
          git config user.name "DMF Pulse Rules Readiness"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "payload produced no changes" >&2; exit 1; }
          git commit -m "$commit_message"
          git push origin HEAD:readiness/RUL-2026-27-full-season-activation
          test "$(git ls-remote origin refs/heads/readiness/RUL-2026-27-full-season-activation | cut -f1)" = "$(git rev-parse HEAD)"
