name: Stage 15 temporary checkpoint transport

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-source-export.yml
      - .stage15-transport/apply-request.json
      - .stage15-transport/export-request.json
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  transport:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[stage15-apply]') &&
       github.event.head_commit.message != 'chore(stage15): consume export request')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested checkpoint archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f .stage15-transport/apply-request.json ]]; then
            exit 0
          fi
          archive_sha256="$(python -c 'import json; print(json.load(open(".stage15-transport/apply-request.json"))["archive_sha256"])')"
          commit_message="$(python -c 'import json; print(json.load(open(".stage15-transport/apply-request.json"))["commit_message"])')"
          mapfile -t blob_shas < <(python - <<'PY'
          import json
          request = json.load(open('.stage15-transport/apply-request.json'))
          for sha in request.get('blob_shas', [request.get('blob_sha')]):
              if sha:
                  print(sha)
          PY
          )
          : > /tmp/stage15-checkpoint.tar.xz
          for blob_sha in "${blob_shas[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob_sha}" > /tmp/stage15-blob.json
            python - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/stage15-blob.json').read_text(encoding='utf-8'))
          with Path('/tmp/stage15-checkpoint.tar.xz').open('ab') as target:
              target.write(base64.b64decode(payload['content'].replace('\n', '')))
          PY
          done
          printf '%s  %s\n' "${archive_sha256}" /tmp/stage15-checkpoint.tar.xz | sha256sum -c -
          tar -xJf /tmp/stage15-checkpoint.tar.xz -C .
          rm -f .stage15-transport/apply-request.json
          rm -f .stage15-transport/source-export.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${commit_message} [stage15-apply]"
          git push origin HEAD:stage/A15/RANK-015-rank-aware-strategy

      - name: Consume export request and legacy metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f .stage15-transport/export-request.json
          rm -f .stage15-transport/source-export.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .stage15-transport
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(stage15): consume export request"
          git push origin HEAD:stage/A15/RANK-015-rank-aware-strategy

      - name: Build exact repository bundle
        shell: bash
        run: git bundle create dmf-pulse.bundle --all

      - name: Upload exact repository bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stage15-source-bundle-${{ github.run_id }}
          path: dmf-pulse.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Publish exact transport coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh issue comment 14 --body \
            "STAGE15_EXPORT run_id=${GITHUB_RUN_ID} artifact_id=${ARTIFACT_ID} head_sha=${head_sha}"
