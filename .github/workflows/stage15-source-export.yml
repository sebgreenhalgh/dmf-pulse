name: Stage 15 checkpoint 15.03 transport

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-source-export.yml

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply checkpoint 15.03
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/stage15-checkpoint.tar.xz
          for blob_sha in \
            804658399068fa37014688c58e0c7f503fda64ab \
            0130d2f12748e9b4ba7a8f7188ee9ccc240d6ac2 \
            cacdb905baafff5a32f346e38c67c0aa9e480de4 \
            a19852ab795a5a48c124daa2dda740b81dadd9f2 \
            95f708978d1aca52173331bb06b24e564869d7cd \
            d017e84c950305aa28e245b386c9bcd503e28161 \
            e6b0767a5b2c846a058589e3e6e347b2b6e45f1b \
            4796751a590a34457e7400fdb259d2e04fc5555e \
            ba6d1dd19c575f8618f1e5f0d63a19b85699a9a3 \
            ccb9b74e55994e8fbbd8a59b80d26e4d0b5e2051 \
            735efa3be17b31fd1258655528a99f6ce8225d9e \
            a2e17cf75fa1d83c9ffa9ebdf6d59965ee0681be \
            a1d30ab7b772a4dd39e915ae2e446ae1b13bbf10
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob_sha}" --jq .content \
              | tr -d '\n' \
              | base64 -d \
              >> /tmp/stage15-checkpoint.tar.xz
          done
          printf '%s  %s\n' \
            3ae648ea9176ad3b09b6b754d576f2e3ac3656d3221a70542457dd778cdb0c2a \
            /tmp/stage15-checkpoint.tar.xz \
            | sha256sum -c -
          tar -xJf /tmp/stage15-checkpoint.tar.xz -C .
          rm -f .stage15-transport/apply-request.json
          rm -f .stage15-transport/source-export.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(rank): complete checkpoint 15.03 opponent action model [stage15-apply]"
          git push origin HEAD:stage/A15/RANK-015-rank-aware-strategy

      - name: Build exact repository bundle
        shell: bash
        run: git bundle create dmf-pulse.bundle --all

      - name: Upload exact repository bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stage15-source-bundle-${{ github.run_id }}
          path: dmf-pulse.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Publish exact transport coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh issue comment 14 --body \
            "STAGE15_EXPORT run_id=${GITHUB_RUN_ID} artifact_id=${ARTIFACT_ID} head_sha=${head_sha}"
