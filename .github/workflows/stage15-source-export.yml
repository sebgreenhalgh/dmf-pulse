name: Stage 15 temporary source export

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-source-export.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.11.26
      - name: Build relocatable development environment
        shell: bash
        run: |
          rm -rf .venv
          uv venv --relocatable .venv
          uv sync --all-groups --frozen
          tar -czf stage15-venv.tar.gz .venv
      - name: Upload development environment
        id: upload_venv
        uses: actions/upload-artifact@v4
        with:
          name: stage15-development-environment
          path: stage15-venv.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Build repository bundle
        shell: bash
        run: git bundle create dmf-pulse.bundle --all
      - name: Upload repository bundle
        id: upload_source
        uses: actions/upload-artifact@v4
        with:
          name: stage15-source-bundle
          path: dmf-pulse.bundle
          if-no-files-found: error
          retention-days: 1
      - name: Publish transport metadata
        shell: bash
        env:
          SOURCE_ARTIFACT_ID: ${{ steps.upload_source.outputs.artifact-id }}
          VENV_ARTIFACT_ID: ${{ steps.upload_venv.outputs.artifact-id }}
        run: |
          mkdir -p .stage15-transport
          printf '{"run_id":%s,"source_artifact_id":%s,"venv_artifact_id":%s,"head_sha":"%s"}\n' \
            "${GITHUB_RUN_ID}" "${SOURCE_ARTIFACT_ID}" "${VENV_ARTIFACT_ID}" "${GITHUB_SHA}" \
            > .stage15-transport/source-export.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stage15-transport/source-export.json
          git commit -m "chore(stage15): publish temporary source export metadata"
          git push origin HEAD:stage/A15/RANK-015-rank-aware-strategy
