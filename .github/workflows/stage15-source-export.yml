name: Stage 15 exact source export

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Synchronise frozen environment
        run: uv sync --all-groups --frozen

      - name: Build exact repository bundle
        shell: bash
        run: git bundle create dmf-pulse.bundle --all

      - name: Build portable local development tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage15-dev-tools/bin stage15-dev-tools/site-packages
          cp .venv/bin/ruff stage15-dev-tools/bin/
          cp -a \
            .venv/lib/python3.13/site-packages/hypothesis* \
            .venv/lib/python3.13/site-packages/sortedcontainers* \
            .venv/lib/python3.13/site-packages/mypy* \
            .venv/lib/python3.13/site-packages/pathspec* \
            .venv/lib/python3.13/site-packages/build* \
            .venv/lib/python3.13/site-packages/pyproject_hooks* \
            .venv/lib/python3.13/site-packages/psycopg* \
            stage15-dev-tools/site-packages/
          tar -czf stage15-dev-tools.tar.gz stage15-dev-tools

      - name: Upload exact repository bundle
        id: source_upload
        uses: actions/upload-artifact@v4
        with:
          name: stage15-source-bundle-${{ github.run_id }}
          path: dmf-pulse.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Upload local development tools
        id: tools_upload
        uses: actions/upload-artifact@v4
        with:
          name: stage15-dev-tools-${{ github.run_id }}
          path: stage15-dev-tools.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish exact export coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ steps.source_upload.outputs.artifact-id }}
          TOOLS_ARTIFACT_ID: ${{ steps.tools_upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh issue comment 14 --body \
            "STAGE15_EXPORT run_id=${GITHUB_RUN_ID} source_artifact_id=${SOURCE_ARTIFACT_ID} tools_artifact_id=${TOOLS_ARTIFACT_ID} head_sha=${head_sha}"
