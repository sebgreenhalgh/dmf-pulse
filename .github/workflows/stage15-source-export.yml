name: Stage 15 temporary source export

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-source-export.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build repository bundle
        shell: bash
        run: git bundle create dmf-pulse.bundle --all
      - name: Upload repository bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stage15-source-bundle
          path: dmf-pulse.bundle
          if-no-files-found: error
          retention-days: 1
      - name: Publish transport metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          mkdir -p .stage15-transport
          printf '{"run_id":%s,"artifact_id":%s,"head_sha":"%s"}\n' \
            "${GITHUB_RUN_ID}" "${ARTIFACT_ID}" "${GITHUB_SHA}" \
            > .stage15-transport/source-export.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stage15-transport/source-export.json
          git commit -m "chore(stage15): publish temporary source export metadata"
          git push origin HEAD:stage/A15/RANK-015-rank-aware-strategy
