name: Stage 15 exact source export

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-source-export.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact repository bundle
        shell: bash
        run: git bundle create dmf-pulse.bundle --all

      - name: Upload exact repository bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stage15-source-bundle-${{ github.run_id }}
          path: dmf-pulse.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Publish exact export coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh issue comment 14 --body \
            "STAGE15_EXPORT run_id=${GITHUB_RUN_ID} artifact_id=${ARTIFACT_ID} head_sha=${head_sha}"
