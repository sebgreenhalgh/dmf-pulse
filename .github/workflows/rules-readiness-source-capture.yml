name: rules-readiness-source-capture

on:
  push:
    branches:
      - readiness/RUL-2026-27-full-season-activation

permissions:
  contents: read

jobs:
  capture-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture current official 2026/27 sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rules-source-capture"
          mkdir -p "$root/payloads" "$root/headers"
          cat > "$root/SOURCE_URLS.tsv" <<'EOF'
          bootstrap-static	https://fantasy.premierleague.com/api/bootstrap-static/
          help-rules	https://fantasy.premierleague.com/help/rules
          help-index	https://fantasy.premierleague.com/help/
          changes	https://www.premierleague.com/en/news/4679873/all-you-need-to-know-about-changes-to-fpl-for-202627
          chips	https://www.premierleague.com/en/news/4679879/whats-happening-with-fpl-chips-in-202627
          bps	https://www.premierleague.com/en/news/4679946/whats-new-in-202627-fantasy-changes-to-bonus-points-system
          defensive-contributions	https://www.premierleague.com/en/news/4361991/whats-happening-with-defensive-contribution-points-in-202627-fantasy
          price-change-predictor	https://www.premierleague.com/en/news/4680462/whats-new-in-202627-fantasy-price-change-predictor
          launch	https://www.premierleague.com/en/news/4680722/fpl-is-live-pick-your-202627-squad-now/
          EOF
          while IFS=$'\t' read -r key url; do
            curl \
              --fail \
              --location \
              --compressed \
              --retry 4 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 120 \
              --user-agent 'DMF-Pulse-Rules-Readiness/1.0 (+official-source-verification)' \
              --dump-header "$root/headers/$key.headers" \
              --output "$root/payloads/$key.body" \
              "$url"
            test -s "$root/payloads/$key.body"
          done < "$root/SOURCE_URLS.tsv"
          python - "$root" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import pathlib
          import sys
          from datetime import UTC, datetime

          root = pathlib.Path(sys.argv[1])
          records = []
          for line in (root / "SOURCE_URLS.tsv").read_text("utf-8").splitlines():
              key, url = line.split("\t", 1)
              body = (root / "payloads" / f"{key}.body").read_bytes()
              headers = (root / "headers" / f"{key}.headers").read_bytes()
              records.append(
                  {
                      "key": key,
                      "url": url,
                      "bytes": len(body),
                      "sha256": hashlib.sha256(body).hexdigest(),
                      "headers_sha256": hashlib.sha256(headers).hexdigest(),
                  }
              )
          manifest = {
              "schema_version": "dmf-official-source-capture-v1",
              "retrieved_at_utc": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "repository": "sebgreenhalgh/dmf-pulse",
              "branch": "readiness/RUL-2026-27-full-season-activation",
              "commit": pathlib.Path(".git/HEAD").read_text("utf-8").strip(),
              "sources": records,
          }
          (root / "SOURCE_CAPTURE.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          sha256sum "$root"/payloads/* "$root"/headers/* "$root"/SOURCE_CAPTURE.json > "$root/MANIFEST.sha256"
          (cd "$root" && sha256sum -c MANIFEST.sha256)

      - name: Upload official source capture
        uses: actions/upload-artifact@v4
        with:
          name: rules-official-source-capture-${{ github.sha }}
          path: ${{ runner.temp }}/rules-source-capture
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
