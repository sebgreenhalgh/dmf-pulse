name: windows-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Python 3.13 / Windows smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/../.uv-cache
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned uv frontend
        run: python -m pip install --disable-pip-version-check uv==0.11.26

      - name: Frozen dependency sync
        run: uv sync --all-groups --frozen

      - name: Installed CLI smoke
        run: |
          uv run dmf --version
          uv run dmf doctor --json
          uv run dmf config validate --environment test --config-root config
          uv run dmf rules validate fixtures/rules/RUL-002/synthetic_complete --json
          uv run dmf specs validate
          uv run dmf ingest fpl validate --resource bootstrap --input fixtures/fpl/FPL-004/happy_path/bootstrap.json --contract-version fpl-reference-v1 --output json
          uv run dmf ingest odds validate --provider the_odds_api --input fixtures/odds/ODD-005/happy_path.json --contract-version the-odds-api-v4-reference-v1 --output json
          uv run dmf events score-distribution --fixture fixtures/events/score/GCS-008/balanced_fixture.json --artifact-root artifacts/gcs008-windows --output json

      - name: Package smoke outside source tree
        run: |
          uv build
          uv run python scripts/verify_gcs008_wheel.py
