name: stage14-checkpoint-transport

on:
  push:
    branches:
      - stage/A14/CHIP-014-chip-optimisation
    paths:
      - recovery/stage14-checkpoint.json
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: stage14-checkpoint-transport
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out canonical Stage 14 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard absent payload
        id: guard
        shell: bash
        run: |
          if [[ -f recovery/stage14-checkpoint.json ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Checkpoint payload was removed by the preceding capability commit."
          fi

      - name: Set up uv
        if: steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Rebase transport on latest canonical branch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Allow the temporary workspace exporter triggered by the payload push
          # to publish its locator before the capability is assembled.
          sleep 45
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            stage/A14/CHIP-014-chip-optimisation:refs/remotes/origin/stage/A14/CHIP-014-chip-optimisation
          git reset --hard refs/remotes/origin/stage/A14/CHIP-014-chip-optimisation
          test -f recovery/stage14-checkpoint.json

      - name: Materialise checkpoint files and mutations
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload_path = Path("recovery/stage14-checkpoint.json")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          message = payload.get("message")
          if not isinstance(message, str) or not message.strip():
              raise SystemExit("checkpoint message must be a non-empty string")

          for raw_path, content in payload.get("files", {}).items():
              path = Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          for mutation in payload.get("mutations", []):
              path = Path(mutation["path"])
              text = path.read_text(encoding="utf-8")
              marker = mutation["marker"]
              content = mutation["content"]
              once_marker = mutation.get("once_marker", content.strip().splitlines()[0])
              if once_marker in text:
                  continue
              operation = mutation["operation"]
              if operation == "append_once":
                  text = text.rstrip() + "\n\n" + content.strip() + "\n"
              elif operation == "insert_before_once":
                  if marker not in text:
                      raise SystemExit(f"marker not found in {path}: {marker!r}")
                  text = text.replace(marker, content + marker, 1)
              elif operation == "insert_after_once":
                  if marker not in text:
                      raise SystemExit(f"marker not found in {path}: {marker!r}")
                  text = text.replace(marker, marker + content, 1)
              elif operation == "replace_once":
                  if marker not in text:
                      raise SystemExit(f"marker not found in {path}: {marker!r}")
                  text = text.replace(marker, content, 1)
              else:
                  raise SystemExit(f"unsupported mutation operation: {operation}")
              path.write_text(text, encoding="utf-8")

          for raw_path in payload.get("delete_paths", []):
              path = Path(raw_path)
              if path.exists():
                  path.unlink()

          payload_path.unlink()
          Path("/tmp/stage14-message.txt").write_text(
              message.strip() + "\n", encoding="utf-8"
          )
          Path("/tmp/stage14-format-paths.txt").write_text(
              "\n".join(payload.get("format_paths", [])) + "\n", encoding="utf-8"
          )
          Path("/tmp/stage14-lint-paths.txt").write_text(
              "\n".join(payload.get("lint_paths", [])) + "\n", encoding="utf-8"
          )
          Path("/tmp/stage14-mypy-paths.txt").write_text(
              "\n".join(payload.get("mypy_paths", [])) + "\n", encoding="utf-8"
          )
          Path("/tmp/stage14-test-commands.sh").write_text(
              "set -euo pipefail\n" + "\n".join(payload.get("test_commands", [])) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Sync locked environment
        if: steps.guard.outputs.skip != 'true'
        run: uv sync --all-groups --frozen

      - name: Format and execute checkpoint verification
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t format_paths < <(grep -v '^$' /tmp/stage14-format-paths.txt || true)
          mapfile -t lint_paths < <(grep -v '^$' /tmp/stage14-lint-paths.txt || true)
          mapfile -t mypy_paths < <(grep -v '^$' /tmp/stage14-mypy-paths.txt || true)
          if (( ${#format_paths[@]} )); then
            uv run ruff format "${format_paths[@]}"
            uv run ruff format --check "${format_paths[@]}"
          fi
          if (( ${#lint_paths[@]} )); then
            uv run ruff check "${lint_paths[@]}"
          fi
          if (( ${#mypy_paths[@]} )); then
            uv run mypy --strict "${mypy_paths[@]}"
          fi
          bash /tmp/stage14-test-commands.sh

      - name: Resolve verification placeholders
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          replacements = {}
          focused = Path("/tmp/stage14-focused.log")
          all_tests = Path("/tmp/stage14-all.log")
          coverage = Path("/tmp/stage14-coverage.json")
          if focused.exists():
              match = re.search(r"(\d+) passed", focused.read_text(encoding="utf-8"))
              if match:
                  replacements["@@FOCUSED_PASSED@@"] = match.group(1)
          if all_tests.exists():
              match = re.search(r"(\d+) passed", all_tests.read_text(encoding="utf-8"))
              if match:
                  replacements["@@ALL_CHIP_PASSED@@"] = match.group(1)
          if coverage.exists():
              totals = json.loads(coverage.read_text(encoding="utf-8"))["totals"]
              replacements.update(
                  {
                      "@@COVERAGE_PERCENT@@": f"{totals['percent_covered']:.2f}",
                      "@@COVERED_BRANCHES@@": str(totals["covered_branches"]),
                      "@@NUM_BRANCHES@@": str(totals["num_branches"]),
                  }
              )
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or ".venv" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for token, value in replacements.items():
                  updated = updated.replace(token, value)
              if "@@" in updated and any(token in updated for token in replacements):
                  raise SystemExit(f"unresolved verification token in {path}")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and push coherent capability
        if: steps.guard.outputs.skip != 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "Sebastian Greenhalgh"
          git config user.email "seb.greenhalgh@outlook.com"
          git commit -F /tmp/stage14-message.txt
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:stage/A14/CHIP-014-chip-optimisation; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              exit 1
            fi
            git fetch --no-tags origin stage/A14/CHIP-014-chip-optimisation:refs/remotes/origin/stage/A14/CHIP-014-chip-optimisation
            git rebase refs/remotes/origin/stage/A14/CHIP-014-chip-optimisation
          done
          capability_sha="$(git rev-parse HEAD)"
          echo "capability_sha=$capability_sha" >> "$GITHUB_OUTPUT"

      - name: Export exact post-checkpoint bundle
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            stage/A14/CHIP-014-chip-optimisation:refs/remotes/origin/stage/A14/CHIP-014-chip-optimisation
          git reset --hard refs/remotes/origin/stage/A14/CHIP-014-chip-optimisation
          git archive --format=zip --output=dmf-pulse-source.zip HEAD
          git bundle create dmf-pulse-stage14.bundle \
            HEAD \
            refs/remotes/origin/main

      - name: Upload exact post-checkpoint bundle
        if: steps.guard.outputs.skip != 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stage14-checkpoint-${{ steps.commit.outputs.capability_sha }}
          path: |
            dmf-pulse-source.zip
            dmf-pulse-stage14.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Publish result locator on auxiliary branch
        if: steps.guard.outputs.skip != 'true'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          CAPABILITY_SHA: ${{ steps.commit.outputs.capability_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin stage14-toolchain-transport:refs/remotes/origin/stage14-toolchain-transport
          git switch --detach refs/remotes/origin/stage14-toolchain-transport
          mkdir -p recovery
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("recovery/stage14-transport-result.json").write_text(
              json.dumps(
                  {
                      "artifact_id": int(os.environ["ARTIFACT_ID"]),
                      "artifact_url": os.environ["ARTIFACT_URL"],
                      "capability_sha": os.environ["CAPABILITY_SHA"],
                      "run_id": int(os.environ["RUN_ID"]),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          git add recovery/stage14-transport-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "checkpoint(chips): publish Stage 14 transport result [skip ci]"
          git push origin HEAD:stage14-toolchain-transport
