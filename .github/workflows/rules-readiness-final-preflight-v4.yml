name: rules-readiness-final-preflight-v4

on:
  push:
    branches:
      - readiness/RUL-2026-27-full-season-activation
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: dmf-pulse-rul-2026-27-preflight-v4
  cancel-in-progress: true

env:
  IMMUTABLE_PARENT: 4f1274ccef419a7c0bde335c48bd4070e248b2e6
  REVIEW_BRANCH: readiness/RUL-2026-27-full-season-activation
  GH_TOKEN: ${{ github.token }}

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel older readiness finalizers and preflights
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            rules-readiness-final-orchestrator.yml \
            rules-readiness-final-preflight-v2.yml \
            rules-readiness-final-preflight-v3.yml; do
            while read -r run_id; do
              [ -n "$run_id" ] && gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 --json databaseId,status --jq '.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested") | .databaseId' 2>/dev/null || true)
          done
          sleep 8

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: readiness/RUL-2026-27-full-season-activation

      - name: Reset to latest remote branch and patch acceptance discovery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git reset --hard "origin/$REVIEW_BRANCH"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"
          git config user.name "dmf-pulse-rules-readiness-bot"
          git config user.email "dmf-pulse-rules-readiness-bot@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          acceptance = Path("scripts/run_2026_27_rules_acceptance.py")
          text = acceptance.read_text(encoding="utf-8")
          old = '''    candidates.update(re.findall(r"\\{([a-z0-9_, -]+)\\}", help_text))
    expanded: set[str] = set()
'''
          new = '''    candidates.update(re.findall(r"\\{([a-z0-9_, -]+)\\}", help_text))
    candidates.update(
        re.findall(
            r"\\b[a-z][a-z0-9-]*(?:capab|readiness|activat|promot)[a-z0-9-]*\\b",
            help_text.lower(),
        )
    )
    expanded: set[str] = set()
'''
          if old in text:
              text = text.replace(old, new, 1)
          old_env = 'env={**os.environ, "PYTHONHASHSEED": "0"},'
          new_env = 'env={**os.environ, "PYTHONHASHSEED": "0", "NO_COLOR": "1", "TERM": "dumb", "COLUMNS": "240"},'
          if old_env in text:
              text = text.replace(old_env, new_env, 1)
          acceptance.write_text(text, encoding="utf-8")

          verifier = Path("scripts/verify_2026_27_source_manifest.py")
          text = verifier.read_text(encoding="utf-8")
          marker = 'def _coverage(corpus: str) -> dict[str, bool]:\n    result: dict[str, bool] = {}\n'
          replacement = '''def _coverage(corpus: str) -> dict[str, bool]:
    corpus = (
        corpus.replace("freehit", "free hit")
        .replace("bboost", "bench boost")
        .replace("3xc", "triple captain")
    )
    result: dict[str, bool] = {}
'''
          if marker in text:
              text = text.replace(marker, replacement, 1)
          verifier.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/rules-readiness-final-orchestrator.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          failure_step = r'''

      - name: Persist a clean diagnostic checkpoint on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          mkdir -p "evidence/tickets/RUL-2026-27/failed-runs/${GITHUB_RUN_ID}"
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > "evidence/tickets/RUL-2026-27/failed-runs/${GITHUB_RUN_ID}/failed.log" 2>&1 || true
          python - <<'PY2'
          import json, os
          from pathlib import Path
          root = Path("evidence/tickets/RUL-2026-27/failed-runs") / os.environ["GITHUB_RUN_ID"]
          payload = {
              "schema_version": "dmf-rules-finalizer-failure-v1",
              "status": "BLOCKED",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "partial_product_changes_persisted": False,
              "production_activation_status": "BLOCKED",
          }
          (root / "failure.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY2
          git config user.name "dmf-pulse-rules-readiness-bot"
          git config user.email "dmf-pulse-rules-readiness-bot@users.noreply.github.com"
          git add "evidence/tickets/RUL-2026-27/failed-runs/${GITHUB_RUN_ID}"
          git commit -m "blocked(rules): record finalizer failure ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"
'''
          if "Persist a clean diagnostic checkpoint on failure" not in workflow_text:
              workflow_text = workflow_text.rstrip() + failure_step + "\n"
          workflow.write_text(workflow_text, encoding="utf-8")
          PY
          rm -f \
            .github/workflows/rules-readiness-final-preflight-v2.yml \
            .github/workflows/rules-readiness-final-preflight-v3.yml \
            .github/workflows/rules-readiness-final-preflight-v4.yml
          git diff --check

      - name: Commit, push and verify hardening
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(rules): harden capability discovery and failure recovery"
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"; then break; fi
            test "$attempt" != 3
            git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
            git rebase "origin/${REVIEW_BRANCH}"
          done
          test "$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"

      - name: Dispatch hardened finalizer
        run: |
          set -euo pipefail
          gh workflow run rules-readiness-final-orchestrator.yml --repo "$GITHUB_REPOSITORY" --ref "$REVIEW_BRANCH"
