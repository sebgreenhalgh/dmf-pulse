name: foundation-ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned uv frontend
        run: python -m pip install --disable-pip-version-check uv==0.11.26

      - name: Frozen dependency sync
        run: uv sync --all-groups --frozen

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Strict typing
        run: uv run mypy src/dmf_pulse

      - name: Offline tests and branch coverage
        env:
          UV_OFFLINE: "1"
        run: uv run pytest --cov=dmf_pulse --cov-branch --cov-report=term-missing

      - name: Build distributions
        run: uv build

      - name: Verify installed wheel outside source tree
        env:
          UV_OFFLINE: "1"
        run: uv run python scripts/verify_wheel.py

      - name: Validate repository and evidence
        run: uv run python scripts/validate_repository.py

      - name: First-party secret scan
        run: uv run python scripts/scan_secrets.py
