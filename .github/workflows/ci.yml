name: dmf-pulse-ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: dmf-pulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: dmf_pulse_test
          POSTGRES_USER: dmf_test
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmf_test -d dmf_pulse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DMF_ENVIRONMENT: TEST
      DMF_TEST_DATABASE_URL: postgresql+psycopg://dmf_test@127.0.0.1:5432/dmf_pulse_test
      PGPASSWORD: changeme
      UV_NO_PROGRESS: "1"
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned uv frontend
        run: python -m pip install --disable-pip-version-check uv==0.11.26

      - name: Frozen dependency sync
        run: uv sync --all-groups --frozen

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Strict typing
        run: uv run mypy src/dmf_pulse

      - name: PostgreSQL ODD-005 migration matrix and inherited vertical slice
        run: |
          uv run python scripts/test_migration_matrix.py --baseline-revision 20260724_0002 --target head
          uv run pytest -m "postgres and integration" tests/integration
          uv run alembic upgrade head --sql > "${{ runner.temp }}/dat003-offline-upgrade.sql"
          uv run dmf data-model doctor --json
          uv run dmf data-model schema-manifest --json
          uv run dmf data-model demo --fixture fixtures/data_model/DAT-003/demo.json --json
          uv run dmf data-model as-of --fixture fixtures/data_model/DAT-003/as_of_queries.json --json

      - name: Tests and branch coverage
        run: |
          uv run pytest --cov=dmf_pulse --cov-branch --cov-report=term-missing --cov-report=json:evidence/tickets/ODD-005/coverage.json
          uv run python scripts/check_odd005_coverage_gates.py evidence/tickets/ODD-005/coverage.json

      - name: FPL regression and ODD-005 synthetic vertical slice
        run: |
          uv run dmf specs validate
          uv run dmf ingest fpl validate --resource bootstrap --input fixtures/fpl/FPL-004/happy_path/bootstrap.json --contract-version fpl-reference-v1 --output json
          uv run dmf ingest fpl replay --fixture-set fixtures/fpl/FPL-004 --scenario happy_path --information-cutoff 2026-08-21T17:30:00Z --rights-profile synthetic_test_v1 --output json
          uv run dmf ingest odds replay --fixture-set fixtures/odds/ODD-005 --scenario happy_path --information-cutoff 2026-08-21T17:30:00Z --rights-profile synthetic_the_odds_api_v1 --output json
          uv run dmf market observations --fixture-external-provider official_fpl --fixture-external-id 101 --season-code 2026/27 --as-of 2026-08-20T12:05:00Z --output json
          uv run python -c "import json; from typer.testing import CliRunner; from dmf_pulse.cli.app import app; r=CliRunner().invoke(app,['ingest','odds','snapshot','--provider','the_odds_api','--competition-key','PL','--sport-key','soccer_epl','--region','uk','--market','h2h','--as-of','2026-08-20T12:05:00Z','--output','json']); value=json.loads(r.stdout); assert r.exit_code == 4 and value['error']['code'] == 'CREDENTIAL_UNAVAILABLE' and value['error']['transport_called'] is False"

      - name: Rules source and golden vertical slice
        run: |
          uv run dmf rules validate fixtures/rules/RUL-002/synthetic_complete --json
          uv run dmf rules compile fixtures/rules/RUL-002/synthetic_complete --output artifacts/rules/rul-002-synthetic.json --json
          uv run dmf rules score-fixture artifacts/rules/rul-002-synthetic.json fixtures/rules/RUL-002/golden_fixture_001.json --json
          uv run dmf rules score-gameweek artifacts/rules/rul-002-synthetic.json fixtures/rules/RUL-002/golden_gameweek_001.json --json

      - name: Build distributions
        run: uv build

      - name: Verify installed wheel outside source tree
        run: uv run python scripts/verify_odd005_wheel.py

      - name: Verify ODD-005 acceptance evidence
        env:
          DMF_ACCEPTANCE_CI_REF: "1"
        run: |
          uv run python scripts/validate_repository.py
          uv run python scripts/verify_odd005_acceptance.py

      - name: Validate repository and evidence
        run: |
          uv run python scripts/generate_odd005_evidence.py --status DRAFT
          uv run dmf evidence validate --ticket ODD-005

      - name: First-party secret scan
        run: uv run python scripts/scan_secrets.py
