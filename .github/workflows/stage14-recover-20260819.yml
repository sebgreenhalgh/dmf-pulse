name: Stage 14 temporary recovery export

on:
  push:
    branches:
      - stage/A14/CHIP-014-chip-optimisation
    paths:
      - recovery/stage14-export-trigger-20260819.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage14-temporary-recovery-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical branch tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical workspace archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=stage14-workspace.zip HEAD
          test -s stage14-workspace.zip

      - name: Publish predictable temporary release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete stage14-workspace-export --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create stage14-workspace-export stage14-workspace.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Temporary Stage 14 workspace export" \
            --notes "Temporary recovery transport for CHIP-014. Remove during final Stage-14 cleanup." \
            --prerelease
