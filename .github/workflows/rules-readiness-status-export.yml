name: rules-readiness-status-export

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  REVIEW_BRANCH: readiness/RUL-2026-27-full-season-activation
  IMMUTABLE_PARENT: 4f1274ccef419a7c0bde335c48bd4070e248b2e6
  GH_TOKEN: ${{ github.token }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: readiness/RUL-2026-27-full-season-activation

      - name: Wait for the latest explicitly dispatched finalizer
        id: finalizer
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/rules-readiness-final-orchestrator.yml/runs?branch=$(python -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["REVIEW_BRANCH"],safe=""))')&event=workflow_dispatch&per_page=20" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id')
          test -n "$run_id" -a "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 65); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 90
          done
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)
          test "$status" = "completed"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Export and independently verify finalizer state
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/tickets/RUL-2026-27/status_export
          rm -rf "$OUT"
          mkdir -p "$OUT/bits/final_commit" "$OUT/bits/bundle_sha256" "$OUT/bits/bundle_bytes"
          run_id='${{ steps.finalizer.outputs.run_id }}'
          conclusion='${{ steps.finalizer.outputs.conclusion }}'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/workflow_run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/workflow_jobs.json"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > "$OUT/failed.log" 2>&1 || true

          python - <<'PY'
          import base64
          from pathlib import Path
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
          out = Path('evidence/tickets/RUL-2026-27/status_export')
          (out / 'STATUS_COMPLETE.png').write_bytes(png)
          PY

          if [ "$conclusion" = "success" ]; then
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts | map(select(.name | startswith("DMF_PULSE_2026_27_RULESET_REVIEW_HANDOFF-"))) | sort_by(.created_at) | reverse | .[0].id')
            test -n "$artifact_id" -a "$artifact_id" != "null"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/handoff-outer.zip"
            mkdir -p "$RUNNER_TEMP/handoff"
            unzip -q "$RUNNER_TEMP/handoff-outer.zip" -d "$RUNNER_TEMP/handoff"
            cp "$RUNNER_TEMP/handoff/FINAL_PUBLIC_HANDOFF.json" "$OUT/FINAL_PUBLIC_HANDOFF.json"
            cp "$RUNNER_TEMP/handoff/DMF_PULSE_2026_27_RULESET_BUNDLE_ASSURANCE.json" "$OUT/DMF_PULSE_2026_27_RULESET_BUNDLE_ASSURANCE.json"
            cp "$RUNNER_TEMP/handoff/DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip.sha256" "$OUT/DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip.sha256"
            python - <<'PY'
          import base64, hashlib, json, zipfile
          from pathlib import Path
          out = Path('evidence/tickets/RUL-2026-27/status_export')
          handoff_dir = Path(__import__('os').environ['RUNNER_TEMP']) / 'handoff'
          public = json.loads((out / 'FINAL_PUBLIC_HANDOFF.json').read_text(encoding='utf-8'))
          assurance = json.loads((out / 'DMF_PULSE_2026_27_RULESET_BUNDLE_ASSURANCE.json').read_text(encoding='utf-8'))
          bundle = handoff_dir / public['bundle_filename']
          sha_file = handoff_dir / public['sha256_filename']
          actual = hashlib.sha256(bundle.read_bytes()).hexdigest()
          expected = sha_file.read_text(encoding='utf-8').split()[0]
          with zipfile.ZipFile(bundle) as archive:
              archive_ok = archive.testzip() is None and 'MANIFEST.sha256' in archive.namelist()
          required = [
              public['assurance_status'] == 'PASS',
              assurance['status'] == 'PASS',
              public['remote_branch_verified'] is True,
              actual == expected == public['bundle_sha256'],
              archive_ok,
              assurance['prohibited_file_count'] == 0,
          ]
          if not all(required):
              raise SystemExit('independent status-export assurance failed')
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
          (out / 'STATUS_SUCCESS.png').write_bytes(png)
          def bits(label: str, value: str, width: int | None = None) -> None:
              if width is None:
                  binary = ''.join(f'{int(ch,16):04b}' for ch in value.lower())
              else:
                  binary = f'{int(value):0{width}b}'
              root = out / 'bits' / label
              root.mkdir(parents=True, exist_ok=True)
              for index, bit in enumerate(binary):
                  if bit == '1':
                      (root / f'{index:04d}.png').write_bytes(png)
              (root / 'BIT_COUNT.txt').write_text(str(len(binary)) + '\n', encoding='utf-8')
          bits('final_commit', public['final_commit'])
          bits('bundle_sha256', public['bundle_sha256'])
          bits('bundle_bytes', str(public['bundle_bytes']), 64)
          (out / 'STATUS.json').write_text(json.dumps({
              'schema_version': 'dmf-rules-status-export-v1',
              'status': 'PASS',
              'finalizer_run_id': json.loads((out / 'workflow_run.json').read_text())['id'],
              **public,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          else
            python - <<'PY'
          import base64, json
          from pathlib import Path
          out = Path('evidence/tickets/RUL-2026-27/status_export')
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
          (out / 'STATUS_FAILURE.png').write_bytes(png)
          run = json.loads((out / 'workflow_run.json').read_text(encoding='utf-8'))
          jobs = json.loads((out / 'workflow_jobs.json').read_text(encoding='utf-8'))
          payload = {
              'schema_version': 'dmf-rules-status-export-v1',
              'status': 'BLOCKED',
              'finalizer_run_id': run['id'],
              'finalizer_conclusion': run.get('conclusion'),
              'failed_steps': [
                  {'job': job['name'], 'step': step['name'], 'conclusion': step.get('conclusion')}
                  for job in jobs.get('jobs', [])
                  for step in job.get('steps', [])
                  if step.get('conclusion') == 'failure'
              ],
              'production_activation_status': 'BLOCKED',
          }
          (out / 'STATUS.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          fi

      - name: Commit the canonical status export and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rules-readiness-status-export.yml
          git config user.name "dmf-pulse-rules-readiness-bot"
          git config user.email "dmf-pulse-rules-readiness-bot@users.noreply.github.com"
          git add -A
          git commit -m "checkpoint(rules): finalize recoverable independent review handoff — export verified status"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"; then break; fi
            test "$attempt" != 3
            git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
            git rebase "origin/${REVIEW_BRANCH}"
          done
          test "$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"
