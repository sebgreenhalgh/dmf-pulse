name: gw1-final-readiness-validation

on:
  push:
    branches:
      - readiness/GW1-2026-27-live-input-initial-squad
    paths:
      - .github/workflows/gw1-final-readiness-validation.yml
      - config/models/fpl_points_simulation.yaml
      - config/rules/fpl-2026-27/**
      - docs/operations/gw1_full_decision_run.md
      - evidence/readiness/**
      - src/dmf_pulse/availability/current.py
      - src/dmf_pulse/cli/app.py
      - src/dmf_pulse/cli/gw1_cmd.py
      - src/dmf_pulse/cli/ingest_cmd.py
      - src/dmf_pulse/evaluation/**
      - src/dmf_pulse/fpl_points/**
      - src/dmf_pulse/optimisation/**
      - src/dmf_pulse/orchestration/**
      - src/dmf_pulse/rules/**
      - tests/unit/cli/test_commands.py
      - tests/unit/evaluation/test_prospective_gw1.py
      - tests/unit/fpl_points/test_current_fpl_points.py
      - tests/unit/optimisation/test_preseason_current.py
      - tests/unit/orchestration/**

permissions:
  contents: read

concurrency:
  group: gw1-final-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Final GW1 engineering readiness
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: dmf_pulse_test
          POSTGRES_USER: dmf_test
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmf_test -d dmf_pulse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DMF_ENVIRONMENT: TEST
      DMF_TEST_DATABASE_URL: postgresql+psycopg://dmf_test@127.0.0.1:5432/dmf_pulse_test
      PGPASSWORD: changeme
      UV_NO_PROGRESS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.26

      - name: Frozen environment sync
        run: uv sync --all-groups --frozen

      - name: Upgrade disposable PostgreSQL
        run: uv run alembic upgrade head

      - name: Current decision and inherited Stage-6 through Stage-12 regressions
        run: >-
          uv run pytest -q
          tests/unit/ingestion/test_session1_current_input.py
          tests/unit/markets/test_current_market.py
          tests/unit/availability/test_current_availability.py
          tests/unit/fpl_points/test_current_football_events.py
          tests/unit/fpl_points/test_current_fpl_points.py
          tests/unit/optimisation
          tests/property/optimisation
          tests/performance/optimisation
          tests/assurance/optimisation
          tests/unit/evaluation
          tests/property/evaluation
          tests/replay/evaluation
          tests/golden/evaluation
          tests/unit/orchestration
          tests/unit/cli/test_commands.py

      - name: Rules, rights, and security regressions
        run: >-
          uv run pytest -q
          tests/unit/rules
          tests/property/rules
          tests/golden/rules
          tests/security
          tests/unit/ingestion/test_rights_and_fixtures.py

      - name: Ruff format
        run: uv run ruff format --check src/dmf_pulse tests scripts

      - name: Ruff lint
        run: uv run ruff check src/dmf_pulse tests scripts

      - name: Strict mypy
        run: uv run mypy

      - name: Build wheel and source distribution
        run: uv build

      - name: Installed-wheel GW1 command smoke outside source tree
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          wheel=$(readlink -f "$wheel")
          venv="${RUNNER_TEMP}/gw1-wheel-venv"
          smoke="${RUNNER_TEMP}/gw1-wheel-smoke"
          uv venv --python 3.13 "$venv"
          uv pip install --python "$venv/bin/python" "$wheel"
          mkdir -p "$smoke"
          cd "$smoke"
          "$venv/bin/dmf" --version
          "$venv/bin/dmf" gw1 run --help

      - name: Repository validation
        run: uv run python scripts/validate_repository.py

      - name: First-party secret scan
        run: uv run python scripts/scan_secrets.py

      - name: Commit whitespace assurance
        run: git diff --check ${{ github.event.before }} ${{ github.sha }}
