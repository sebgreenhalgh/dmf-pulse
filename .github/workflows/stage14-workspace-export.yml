name: stage14-apply-checkpoint

on:
  push:
    branches:
      - stage/A14/CHIP-014-chip-optimisation
    paths:
      - recovery/stage14-apply-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage14-apply-checkpoint
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Verify and materialise payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          recovery = Path("recovery")
          parts = sorted(recovery.glob("stage14-checkpoint.json.gz.b64.part-*"))
          expected = [
              recovery / f"stage14-checkpoint.json.gz.b64.part-{index:03d}"
              for index in range(9)
          ]
          if parts != expected:
              raise SystemExit(f"unexpected payload parts: {[str(path) for path in parts]}")
          encoded = b"".join(path.read_bytes() for path in parts)
          if len(encoded) != 98149:
              raise SystemExit(f"encoded length mismatch: {len(encoded)}")
          encoded_sha = hashlib.sha256(encoded).hexdigest()
          if encoded_sha != "70388ca49fecf9093bc40f00b234400d9416e38ee422ffa74ba1ed715ec4f4c8":
              raise SystemExit(f"encoded digest mismatch: {encoded_sha}")
          decoded = gzip.decompress(base64.b64decode(encoded.strip(), validate=True))
          if len(decoded) != 389264:
              raise SystemExit(f"decoded length mismatch: {len(decoded)}")
          decoded_sha = hashlib.sha256(decoded).hexdigest()
          if decoded_sha != "658ed25fa439340cff7193e00b9817655d377b29ce24fae8126893e2e0bda467":
              raise SystemExit(f"decoded digest mismatch: {decoded_sha}")
          payload = json.loads(decoded)
          message = payload["message"].strip()
          if not message:
              raise SystemExit("empty checkpoint message")
          for raw_path, content in payload["files"].items():
              path = Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          for mutation in payload.get("mutations", []):
              path = Path(mutation["path"])
              text = path.read_text(encoding="utf-8")
              marker = mutation["marker"]
              content = mutation["content"]
              once = mutation.get("once_marker", content.strip().splitlines()[0])
              if once in text:
                  continue
              operation = mutation["operation"]
              if operation == "append_once":
                  text = text.rstrip() + "\n\n" + content.strip() + "\n"
              elif operation == "insert_before_once":
                  text = text.replace(marker, content + marker, 1)
              elif operation == "insert_after_once":
                  text = text.replace(marker, marker + content, 1)
              elif operation == "replace_once":
                  text = text.replace(marker, content, 1)
              else:
                  raise SystemExit(f"unsupported mutation: {operation}")
              path.write_text(text, encoding="utf-8")
          for raw_path in payload.get("delete_paths", []):
              path = Path(raw_path)
              if path.exists():
                  path.unlink()
          for path in parts:
              path.unlink()
          for name in (
              "stage14-checkpoint.json.gz.b64",
              "stage14-apply-trigger.txt",
          ):
              path = recovery / name
              if path.exists():
                  path.unlink()
          Path("/tmp/stage14-message.txt").write_text(message + "\n")
          for key in ("format_paths", "lint_paths", "mypy_paths"):
              Path(f"/tmp/stage14-{key}.json").write_text(json.dumps(payload[key]))
          Path("/tmp/stage14-tests.sh").write_text(
              "set -euo pipefail\n" + "\n".join(payload["test_commands"]) + "\n"
          )
          PY

      - name: Sync locked environment
        run: uv sync --all-groups --frozen

      - name: Format, analyse and test
        shell: bash
        run: |
          set -euo pipefail
          readarray -t format_paths < <(python -c 'import json; print(*json.load(open("/tmp/stage14-format_paths.json")), sep="\n")')
          readarray -t lint_paths < <(python -c 'import json; print(*json.load(open("/tmp/stage14-lint_paths.json")), sep="\n")')
          readarray -t mypy_paths < <(python -c 'import json; print(*json.load(open("/tmp/stage14-mypy_paths.json")), sep="\n")')
          uv run ruff format "${format_paths[@]}"
          uv run ruff format --check "${format_paths[@]}"
          uv run ruff check "${lint_paths[@]}"
          uv run mypy --strict "${mypy_paths[@]}"
          bash /tmp/stage14-tests.sh

      - name: Record verified counts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          replacements = {}
          for token, name in (
              ("@@FOCUSED_PASSED@@", "stage14-focused.log"),
              ("@@ALL_CHIP_PASSED@@", "stage14-all.log"),
          ):
              text = (Path("/tmp") / name).read_text(encoding="utf-8")
              match = re.search(r"(\d+) passed", text)
              if not match:
                  raise SystemExit(f"test count absent from {name}")
              replacements[token] = match.group(1)
          for raw_path in (
              "tickets/CHIP-014/PROGRESS.md",
              "evidence/tickets/CHIP-014/CHECKPOINT_14_07.md",
          ):
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              for token, value in replacements.items():
                  text = text.replace(token, value)
              if "@@" in text:
                  raise SystemExit(f"unresolved placeholder in {path}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "Sebastian Greenhalgh"
          git config user.email "seb.greenhalgh@outlook.com"
          git commit -F /tmp/stage14-message.txt
          git push origin HEAD:stage/A14/CHIP-014-chip-optimisation
