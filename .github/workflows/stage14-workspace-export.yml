name: stage14-checkpoint-transport

on:
  push:
    branches:
      - stage/A14/CHIP-014-chip-optimisation
    paths:
      - recovery/stage14-apply.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage14-checkpoint-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Stage 14
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          transport="recovery/stage14-apply.json"
          if [[ ! -f "$transport" ]]; then
            echo "No checkpoint transport is present; nothing to apply."
            exit 0
          fi

          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          path = Path("recovery/stage14-apply.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          patch = gzip.decompress(base64.b64decode(payload["patch_gzip_base64"]))
          Path("/tmp/stage14.patch").write_bytes(patch)
          Path("/tmp/stage14-message.txt").write_text(
              str(payload["message"]) + "\n", encoding="utf-8"
          )
          PY

          git apply --check --whitespace=error /tmp/stage14.patch
          git apply --index --whitespace=error /tmp/stage14.patch
          git rm "$transport"
          git diff --cached --check

          git config user.name "Sebastian Greenhalgh"
          git config user.email "seb.greenhalgh@outlook.com"
          git commit -F /tmp/stage14-message.txt
          git push origin HEAD:stage/A14/CHIP-014-chip-optimisation
