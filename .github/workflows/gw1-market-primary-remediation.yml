name: gw1-market-primary-remediation

on:
  push:
    branches:
      - readiness/GW1-2026-27-market-primary-remediation
    paths:
      - .github/workflows/gw1-market-primary-remediation.yml
      - PLANS.md
      - config/providers/the_odds_api.json
      - docs/adr/ADR-MKT-007-GW1-FULL-TIME-TOTALS.md
      - evidence/tickets/GW1-MKT-001/**
      - tickets/GW1-MKT-001/**
      - src/dmf_pulse/assurance/canonical.py
      - src/dmf_pulse/football_events/**
      - src/dmf_pulse/fpl_points/current.py
      - src/dmf_pulse/ingestion/odds/**
      - src/dmf_pulse/markets/**
      - tests/unit/availability/test_current_availability.py
      - tests/unit/cli/test_live_odds_snapshot.py
      - tests/unit/fpl_points/test_current_football_events.py
      - tests/unit/ingestion/test_fpl_odds_fixture_identity.py
      - tests/unit/ingestion/test_fpl_odds_team_identity.py
      - tests/unit/ingestion/test_live_odds_current_input.py
      - tests/unit/ingestion/test_live_odds_transport.py
      - tests/unit/ingestion/test_odds_foundation.py
      - tests/unit/ingestion/test_odds_model_config_boundaries.py
      - tests/unit/ingestion/test_session1_current_input.py
      - tests/unit/markets/test_current_market.py

permissions:
  contents: read

jobs:
  validate:
    name: Market-primary current bridge / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned uv frontend
        run: python -m pip install --disable-pip-version-check uv==0.11.26

      - name: Frozen dependency sync
        run: uv sync --all-groups --frozen

      - name: Current market-primary regressions
        run: >-
          uv run pytest -q
          tests/unit/ingestion/test_live_odds_current_input.py
          tests/unit/ingestion/test_live_odds_transport.py
          tests/unit/ingestion/test_session1_current_input.py
          tests/unit/ingestion/test_fpl_odds_fixture_identity.py
          tests/unit/ingestion/test_fpl_odds_team_identity.py
          tests/unit/ingestion/test_odds_foundation.py
          tests/unit/ingestion/test_odds_model_config_boundaries.py
          tests/unit/cli/test_live_odds_snapshot.py
          tests/unit/availability/test_current_availability.py
          tests/unit/markets/test_current_market.py
          tests/unit/football_events/test_market_constraints.py
          tests/unit/football_events/test_market_constraint_adversarial.py
          tests/unit/football_events/test_score_projection.py
          tests/unit/football_events/test_public_model_boundaries.py
          tests/unit/fpl_points/test_current_football_events.py

      - name: Formatting and lint
        run: |
          uv run ruff format --check src/dmf_pulse tests scripts
          uv run ruff check src/dmf_pulse tests scripts

      - name: Strict typing
        run: uv run mypy src/dmf_pulse

      - name: Build and installed-wheel smoke outside source tree
        shell: bash
        run: |
          uv build
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          wheel=$(readlink -f "$wheel")
          venv="${RUNNER_TEMP}/market-primary-wheel-venv"
          smoke="${RUNNER_TEMP}/market-primary-wheel-smoke"
          uv venv --python 3.13 "$venv"
          uv pip install --python "$venv/bin/python" "$wheel"
          mkdir -p "$smoke"
          cd "$smoke"
          "$venv/bin/dmf" --version
          "$venv/bin/dmf" ingest odds snapshot --help

      - name: Repository and secret validation
        run: |
          uv run python scripts/validate_repository.py
          uv run python scripts/scan_secrets.py
          git diff --check HEAD^ HEAD
