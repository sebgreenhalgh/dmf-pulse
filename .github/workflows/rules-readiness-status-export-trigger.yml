name: rules-readiness-status-export-trigger

on:
  push:
    branches:
      - readiness/RUL-2026-27-full-season-activation

permissions:
  actions: write
  contents: write

env:
  REVIEW_BRANCH: readiness/RUL-2026-27-full-season-activation
  GH_TOKEN: ${{ github.token }}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: readiness/RUL-2026-27-full-season-activation
      - name: Dispatch one-shot status export
        run: gh workflow run rules-readiness-status-export.yml --repo "$GITHUB_REPOSITORY" --ref "$REVIEW_BRANCH"
      - name: Remove this trigger from the authorised review branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          rm -f .github/workflows/rules-readiness-status-export-trigger.yml
          git config user.name "dmf-pulse-rules-readiness-bot"
          git config user.email "dmf-pulse-rules-readiness-bot@users.noreply.github.com"
          git add -A
          git commit -m "checkpoint(rules): finalize recoverable independent review handoff — remove status trigger"
          git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"
