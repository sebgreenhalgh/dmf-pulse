name: Stage 15 temporary validation

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Synchronise frozen environment
        run: uv sync --all-groups --frozen

      - name: Ruff format
        run: uv run ruff format --check src/dmf_pulse/rank_strategy tests/support tests/unit/rank_strategy tests/property/rank_strategy tests/integration/rank_strategy

      - name: Ruff lint
        run: uv run ruff check src/dmf_pulse/rank_strategy tests/support/rank_strategy_fixtures.py tests/support/opponent_action_fixtures.py tests/support/rank_utility_fixtures.py tests/unit/rank_strategy tests/property/rank_strategy tests/integration/rank_strategy

      - name: Strict mypy
        run: uv run mypy --strict src/dmf_pulse/rank_strategy

      - name: Stage 15 branch coverage
        run: >-
          uv run pytest
          tests/unit/rank_strategy
          tests/property/rank_strategy
          tests/integration/rank_strategy
          --cov=dmf_pulse.rank_strategy
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
          --junitxml=stage15-junit.xml
          -q

      - name: Targeted inherited regressions
        run: >-
          uv run pytest -q
          tests/property/optimisation/test_oracle_equivalence.py::test_independent_oracle_matches_every_scenario_score
          tests/property/optimisation/test_oracle_equivalence.py::test_independent_exhaustive_oracle_matches_exact_global_optimum
          tests/unit/chips/test_captaincy.py::test_captain_appears_and_vice_is_conditional_fallback
          tests/unit/chips/test_captaincy.py::test_captain_absent_vice_appears
          tests/unit/chips/test_captaincy.py::test_both_absent_scores_no_captain_copy
          tests/unit/chips/test_captaincy.py::test_tc_jointly_enumerates_an_alternative_pair
          tests/unit/chips/test_bench_boost.py::test_four_player_bench_including_goalkeeper_scores_incrementally
          tests/unit/chips/test_bench_boost.py::test_autosub_overlap_is_subtracted_from_bench_sum
          tests/unit/chips/test_free_hit.py::test_permanent_squad_bank_and_purchase_prices_restore_exactly
          tests/unit/chips/test_free_hit.py::test_free_transfer_transition_is_rules_driven_and_preserved
          tests/unit/chips/test_free_hit.py::test_common_scenario_mismatch_and_duplicate_candidates_fail_closed

      - name: Publish validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: >-
          gh issue comment 14 --body
          "STAGE15_VALIDATION sha=${GITHUB_SHA} status=${JOB_STATUS} run_id=${GITHUB_RUN_ID}"
