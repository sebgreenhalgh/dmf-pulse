name: gw1-session1-tool-export

on:
  push:
    branches:
      - readiness/GW1-2026-27-live-input-initial-squad
    paths:
      - .github/workflows/gw1-session1-tool-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv sync --all-groups --frozen
          test -x .venv/bin/ruff
          test -x .venv/bin/uv || true
          mkdir -p artifacts/gw1-session1-bootstrap/tools
          cp .venv/bin/ruff artifacts/gw1-session1-bootstrap/tools/ruff
          chmod 0755 artifacts/gw1-session1-bootstrap/tools/ruff
          sha256sum artifacts/gw1-session1-bootstrap/tools/ruff > artifacts/gw1-session1-bootstrap/tools/ruff.sha256
      - name: Upload tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmf-pulse-gw1-tools-${{ github.run_id }}
          path: artifacts/gw1-session1-bootstrap/tools
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Record run and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/gw1-session1-bootstrap/TOOLS_ARTIFACT_RUN_ID.txt
          rm -f .github/workflows/gw1-session1-tool-export.yml
          git config user.name "dmf-pulse-gw1-session1-bot"
          git config user.email "dmf-pulse-gw1-session1-bot@users.noreply.github.com"
          git add -A
          git add -f artifacts/gw1-session1-bootstrap/TOOLS_ARTIFACT_RUN_ID.txt
          git commit -m "chore(gw1): record tool artifact run"
          git push origin HEAD:refs/heads/readiness/GW1-2026-27-live-input-initial-squad
