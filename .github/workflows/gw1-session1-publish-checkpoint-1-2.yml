name: gw1-session1-publish-checkpoint-1-2

on:
  push:
    branches:
      - readiness/GW1-2026-27-live-input-initial-squad
    paths:
      - .github/workflows/gw1-session1-publish-checkpoint-1-2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish verified checkpoint 1.2
        shell: bash
        run: |
          set -euo pipefail
          branch='readiness/GW1-2026-27-live-input-initial-squad'
          expected_parent='448749c072900642a922ae1456d0d30111a3e9ea'
          immutable_parent='9eb57143f6ee92f67c78607cc386678d962e62d4'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git switch -C "$branch"
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/gw1-1.2.patch
          git apply --index /tmp/gw1-1.2.patch
          rm -f .github/workflows/gw1-session1-publish-checkpoint-1-2.yml
          git config user.name 'dmf-pulse-gw1-session1-bot'
          git config user.email 'dmf-pulse-gw1-session1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(gw1): add governed current FPL input foundation'
          capability_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$branch)"

          CAPABILITY_SHA="$capability_sha" python - <<'PY'
          from pathlib import Path
          import os

          path = Path('evidence/readiness/GW1_SESSION1_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          sha = os.environ['CAPABILITY_SHA']
          replacements = {
              '- Latest pushed capability SHA: `448749c072900642a922ae1456d0d30111a3e9ea` (checkpoint 1.1).': f'- Latest pushed capability SHA: `{sha}` (checkpoint 1.2).',
              '- Checkpoint 1.2 candidate: pending publication; the following evidence is for the exact clean candidate diff.': '- Checkpoint 1.2 publication verified against the remote branch; the evidence-record commit follows the capability commit.',
              '| 1.2 Current official FPL input foundation | PENDING_PUBLICATION | Implementation, focused tests, operator documentation and validation gates are complete locally; checkpoint becomes COMPLETE only after the capability commit is verified on the remote branch. |': f'| 1.2 Current official FPL input foundation | COMPLETE | Published as `{sha}`; DB-free rights-gated current official-FPL compilation, safe CLI summary, temporal/identity checks, tests and operator documentation verified. |',
              '- Exact next action: publish checkpoint 1.2, verify remote equality, mark it COMPLETE with the exact capability SHA, then begin checkpoint 1.3 live-odds retrieval.': '- Exact next action: implement checkpoint 1.3, the secret-safe live The Odds API retrieval foundation with quota/429/source-timing controls and focused tests.',
              '## Checkpoint 1.2 candidate evidence': '## Checkpoint 1.2 evidence',
              '- Worktree cleanliness and local/remote equality: pending checkpoint publication.': f'- Capability commit: `{sha}`.\n- Remote equality after capability push: PASS.\n- Worktree cleanliness at evidence publication: PASS.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected progress text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git add evidence/readiness/GW1_SESSION1_PROGRESS.md
          git diff --cached --check
          git commit -m 'docs(gw1): record current FPL checkpoint evidence'
          git push origin "HEAD:refs/heads/$branch"
          git push origin --delete tmp/gw1-session1-head-probe || true
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$branch)"
          test "$(git merge-base "$immutable_parent" HEAD)" = "$immutable_parent"
          test -z "$(git status --short)"

      - name: Build exact checkpoint bundle
        shell: bash
        run: |
          set -euo pipefail
          branch='readiness/GW1-2026-27-live-input-initial-squad'
          mkdir -p /tmp/gw1-1.2-recovery
          git bundle create /tmp/gw1-1.2-recovery/dmf-pulse-gw1.bundle "refs/heads/$branch"
          git bundle verify /tmp/gw1-1.2-recovery/dmf-pulse-gw1.bundle
          git rev-parse HEAD > /tmp/gw1-1.2-recovery/BUNDLE_HEAD.txt
          git rev-parse "origin/$branch" > /tmp/gw1-1.2-recovery/REMOTE_HEAD.txt
          git status --short > /tmp/gw1-1.2-recovery/GIT_STATUS_SHORT.txt
          test ! -s /tmp/gw1-1.2-recovery/GIT_STATUS_SHORT.txt
          sha256sum /tmp/gw1-1.2-recovery/dmf-pulse-gw1.bundle > /tmp/gw1-1.2-recovery/dmf-pulse-gw1.bundle.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dmf-pulse-gw1-session1-checkpoint-1-2-${{ github.run_id }}
          path: /tmp/gw1-1.2-recovery
          retention-days: 2
          if-no-files-found: error
