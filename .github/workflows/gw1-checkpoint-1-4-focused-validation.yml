name: gw1-checkpoint-1-4-focused-validation

on:
  push:
    branches:
      - readiness/GW1-2026-27-live-input-initial-squad
    paths:
      - .github/workflows/gw1-checkpoint-1-4-focused-validation.yml

permissions:
  contents: write

concurrency:
  group: gw1-checkpoint-1-4-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-and-publish:
    name: Recover accepted 1.4A and publish 1.4B
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore accepted lineage and publish exact fixture identity
        shell: bash
        run: |
          set -euo pipefail
          accepted="3abd02aa28959b0cfa6f56f3b5e58271ae0c9e61"
          payload="build/gw1-checkpoint-1-4b-payload.b64"
          archive="${RUNNER_TEMP}/gw1-checkpoint-1-4b-payload.tar.gz"
          base64 --decode "$payload" >"$archive"
          echo "ef8b77ed50a5317eb32ead4b1c219da78321049b8e52dc73d6a24fdbe8530ce7  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C .
          git show "$accepted:.github/workflows/gw1-checkpoint-1-4-focused-validation.yml" \
            >.github/workflows/gw1-checkpoint-1-4-focused-validation.yml
          git show "$accepted:PLANS.md" >PLANS.md
          git show "$accepted:evidence/readiness/GW1_SESSION1_PROGRESS.md" \
            >evidence/readiness/GW1_SESSION1_PROGRESS.md
          git show "$accepted:evidence/readiness/GW1_SESSION1_VALIDATION_1_4A.md" \
            >evidence/readiness/GW1_SESSION1_VALIDATION_1_4A.md
          git show "$accepted:tests/unit/ingestion/test_fpl_odds_team_identity.py" \
            >tests/unit/ingestion/test_fpl_odds_team_identity.py
          rm -f "$payload" .github/workflows/gw1-checkpoint-1-4-publisher.yml
          rmdir build 2>/dev/null || true
          python -m py_compile \
            src/dmf_pulse/ingestion/odds/mapping.py \
            src/dmf_pulse/ingestion/odds/identity.py \
            tests/unit/ingestion/test_fpl_odds_team_identity.py \
            tests/unit/ingestion/test_fpl_odds_fixture_identity.py
          git diff --check
          git status --short
          git config user.name "dmf-pulse-gw1-publisher-bot"
          git config user.email "dmf-pulse-gw1-publisher-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(gw1): map current odds events to FPL fixtures"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
