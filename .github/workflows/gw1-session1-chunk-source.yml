name: gw1-session1-chunk-source

on:
  push:
    branches:
      - readiness/GW1-2026-27-live-input-initial-squad
    paths:
      - .github/workflows/gw1-session1-chunk-source.yml

permissions:
  contents: write

jobs:
  chunk-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and chunk source archive
        shell: bash
        run: |
          set -euo pipefail
          archive=artifacts/gw1-session1-bootstrap/dmf-pulse-source.tar.gz
          test -s "$archive"
          expected=$(awk '{print $1}' artifacts/gw1-session1-bootstrap/dmf-pulse-source.tar.gz.sha256)
          actual=$(sha256sum "$archive" | awk '{print $1}')
          test "$actual" = "$expected"
          rm -rf artifacts/gw1-session1-bootstrap/chunks
          mkdir -p artifacts/gw1-session1-bootstrap/chunks
          base64 -w 0 "$archive" | split -b 120000 -d -a 4 - \
            artifacts/gw1-session1-bootstrap/chunks/part-
          for file in artifacts/gw1-session1-bootstrap/chunks/part-*; do mv "$file" "$file.txt"; done
          count=$(find artifacts/gw1-session1-bootstrap/chunks -type f -name 'part-*.txt' | wc -l)
          bytes=$(stat -c %s "$archive")
          cat > artifacts/gw1-session1-bootstrap/chunks/MANIFEST.json <<EOF
          {
            "archive_bytes": $bytes,
            "archive_sha256": "$actual",
            "base64_chunk_bytes": 120000,
            "chunk_count": $count,
            "encoding": "base64"
          }
          EOF

      - name: Publish chunks and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gw1-session1-chunk-source.yml
          git config user.name "dmf-pulse-gw1-session1-bot"
          git config user.email "dmf-pulse-gw1-session1-bot@users.noreply.github.com"
          git add -A
          git add -f artifacts/gw1-session1-bootstrap/chunks
          git commit -m "chore(gw1): publish bounded source snapshot chunks"
          git push origin HEAD:refs/heads/readiness/GW1-2026-27-live-input-initial-squad
