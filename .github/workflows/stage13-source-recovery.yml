name: stage13-finalize-clean-branch

on:
  push:
    branches:
      - stage/A13/PRC-013-price-prediction
    paths:
      - recovery/stage13-payload.part-*
      - recovery/stage13-payload.tar.gz.sha256

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out publication payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify payload and construct exact clean commit
        env:
          IMMUTABLE_PARENT: ce7fe8f4354d95a477afcf6eed45f63cf0ab772e
          EXPECTED_TREE: bcba32d37b1dfe6641ca47ce62f9f1969e650297
          EXPECTED_COMMIT: 0dfdb83af82b7f5b42602d37f83fc53170c3b125
          FINAL_BRANCH: stage/A13/PRC-013-price-prediction
          FINAL_DATE: 2026-08-18T01:10:00Z
        run: |
          payload="$RUNNER_TEMP/stage13-payload.tar.gz"
          cat recovery/stage13-payload.part-* > "$payload"
          expected_payload=$(awk '{print $1}' recovery/stage13-payload.tar.gz.sha256)
          actual_payload=$(sha256sum "$payload" | awk '{print $1}')
          test "$expected_payload" = "$actual_payload"

          final_root="$RUNNER_TEMP/stage13-final"
          git worktree add --detach "$final_root" "$IMMUTABLE_PARENT"
          tar -xzf "$payload" -C "$final_root"

          cd "$final_root"
          test "$(git rev-parse HEAD)" = "$IMMUTABLE_PARENT"
          git diff --check
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

          git config user.name 'Sebastian Greenhalgh'
          git config user.email 'seb.greenhalgh@outlook.com'
          export GIT_AUTHOR_DATE="$FINAL_DATE"
          export GIT_COMMITTER_DATE="$FINAL_DATE"
          git commit -m 'feat(prices): implement Stage 13 price prediction and ACT-WAIT'
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^)" = "$IMMUTABLE_PARENT"
          test -z "$(git status --short)"

          git push --force origin "HEAD:refs/heads/$FINAL_BRANCH"
