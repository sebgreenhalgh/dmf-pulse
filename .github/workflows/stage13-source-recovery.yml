name: stage13-source-recovery

on:
  push:
    branches:
      - stage/A13/PRC-013-price-prediction

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archive
        run: |
          tar --exclude=.git --exclude=.venv --exclude=.pytest_cache --exclude='**/__pycache__' -czf "$RUNNER_TEMP/dmf-pulse-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/dmf-pulse-source.tar.gz" > "$RUNNER_TEMP/dmf-pulse-source.tar.gz.sha256"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: dmf-pulse-source
          path: |
            ${{ runner.temp }}/dmf-pulse-source.tar.gz
            ${{ runner.temp }}/dmf-pulse-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Record recovery run ID
        run: |
          mkdir -p recovery
          printf '%s\n' "$GITHUB_RUN_ID" > recovery/RUN_ID.txt
          printf '%s\n' "$GITHUB_SHA" > recovery/SOURCE_COMMIT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/RUN_ID.txt recovery/SOURCE_COMMIT.txt
          git commit -m 'chore: record Stage 13 source recovery run'
          git push
