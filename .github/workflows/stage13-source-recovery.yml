name: stage13-offline-wheelhouse

on:
  push:
    branches:
      - stage/A13/PRC-013-price-prediction

permissions:
  contents: write

jobs:
  wheelhouse:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.11.26
      - name: Export and download locked dependencies
        run: |
          uv export --all-groups --frozen --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          python -m pip download --disable-pip-version-check --dest "$RUNNER_TEMP/wheelhouse" --requirement "$RUNNER_TEMP/requirements.txt"
          python -m pip download --disable-pip-version-check --dest "$RUNNER_TEMP/wheelhouse" 'editables==0.5'
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dmf-pulse-wheelhouse.tar.gz" requirements.txt wheelhouse
          sha256sum "$RUNNER_TEMP/dmf-pulse-wheelhouse.tar.gz" > "$RUNNER_TEMP/dmf-pulse-wheelhouse.tar.gz.sha256"
      - name: Upload locked wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: dmf-pulse-wheelhouse
          path: |
            ${{ runner.temp }}/dmf-pulse-wheelhouse.tar.gz
            ${{ runner.temp }}/dmf-pulse-wheelhouse.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Record wheelhouse run ID
        run: |
          mkdir -p recovery
          printf '%s\n' "$GITHUB_RUN_ID" > recovery/WHEELHOUSE_RUN_ID.txt
          printf '%s\n' "$GITHUB_SHA" > recovery/WHEELHOUSE_SOURCE_COMMIT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/WHEELHOUSE_RUN_ID.txt recovery/WHEELHOUSE_SOURCE_COMMIT.txt
          git commit -m 'chore: record Stage 13 wheelhouse run'
          git push
