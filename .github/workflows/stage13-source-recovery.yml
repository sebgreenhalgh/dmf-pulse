name: stage13-parent-git-bundle

on:
  push:
    branches:
      - stage/A13/PRC-013-price-prediction

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact immutable-parent Git bundle
        run: |
          git branch bundle-parent ce7fe8f4354d95a477afcf6eed45f63cf0ab772e
          git bundle create "$RUNNER_TEMP/dmf-pulse-parent.bundle" bundle-parent
          git bundle verify "$RUNNER_TEMP/dmf-pulse-parent.bundle"
          sha256sum "$RUNNER_TEMP/dmf-pulse-parent.bundle" > "$RUNNER_TEMP/dmf-pulse-parent.bundle.sha256"
      - name: Upload Git bundle
        uses: actions/upload-artifact@v4
        with:
          name: dmf-pulse-parent-git-bundle
          path: |
            ${{ runner.temp }}/dmf-pulse-parent.bundle
            ${{ runner.temp }}/dmf-pulse-parent.bundle.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Record bundle run ID
        run: |
          mkdir -p recovery
          printf '%s\n' "$GITHUB_RUN_ID" > recovery/BUNDLE_RUN_ID.txt
          printf '%s\n' "$GITHUB_SHA" > recovery/BUNDLE_SOURCE_COMMIT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/BUNDLE_RUN_ID.txt recovery/BUNDLE_SOURCE_COMMIT.txt
          git commit -m 'chore: record Stage 13 parent bundle run'
          git push
