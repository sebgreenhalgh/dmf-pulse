name: gw1-session1-publish-checkpoint-1-1

on:
  push:
    branches:
      - readiness/GW1-2026-27-live-input-initial-squad
    paths:
      - .github/workflows/gw1-session1-publish-checkpoint-1-1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified checkpoint 1.1
        shell: bash
        run: |
          set -euo pipefail
          branch='readiness/GW1-2026-27-live-input-initial-squad'
          expected_parent='743e8167ec77f1d4b1795e4278b7047b8859b0d7'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git switch -C "$branch"
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/gw1-1.1.patch
          rm -rf artifacts/gw1-session1-bootstrap
          git apply --index /tmp/gw1-1.1.patch
          rm -f .github/workflows/gw1-session1-publish-checkpoint-1-1.yml
          git config user.name 'dmf-pulse-gw1-session1-bot'
          git config user.email 'dmf-pulse-gw1-session1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(gw1): add secret-safe runtime odds credential provider'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$branch)"
          test "$(git merge-base 9eb57143f6ee92f67c78607cc386678d962e62d4 HEAD)" = '9eb57143f6ee92f67c78607cc386678d962e62d4'

      - name: Build exact checkpoint bundle
        shell: bash
        run: |
          set -euo pipefail
          branch='readiness/GW1-2026-27-live-input-initial-squad'
          mkdir -p /tmp/gw1-1.1-recovery
          git bundle create /tmp/gw1-1.1-recovery/dmf-pulse-gw1.bundle "refs/heads/$branch"
          git bundle verify /tmp/gw1-1.1-recovery/dmf-pulse-gw1.bundle
          git rev-parse HEAD > /tmp/gw1-1.1-recovery/BUNDLE_HEAD.txt
          git rev-parse "origin/$branch" > /tmp/gw1-1.1-recovery/REMOTE_HEAD.txt
          git status --short > /tmp/gw1-1.1-recovery/GIT_STATUS_SHORT.txt
          test ! -s /tmp/gw1-1.1-recovery/GIT_STATUS_SHORT.txt
          sha256sum /tmp/gw1-1.1-recovery/dmf-pulse-gw1.bundle > /tmp/gw1-1.1-recovery/dmf-pulse-gw1.bundle.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dmf-pulse-gw1-session1-checkpoint-1-1-${{ github.run_id }}
          path: /tmp/gw1-1.1-recovery
          retention-days: 2
          if-no-files-found: error
