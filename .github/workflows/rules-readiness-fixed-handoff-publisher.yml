name: rules-readiness-fixed-handoff-publisher

on:
  push:
    branches:
      - readiness/RUL-2026-27-full-season-activation

permissions:
  actions: write
  contents: write

env:
  REVIEW_BRANCH: readiness/RUL-2026-27-full-season-activation
  IMMUTABLE_PARENT: 4f1274ccef419a7c0bde335c48bd4070e248b2e6
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Cancel obsolete status-only workflows
        shell: bash
        run: |
          set -euo pipefail
          for workflow in rules-readiness-status-export.yml rules-readiness-status-export-trigger.yml; do
            while read -r run_id; do
              [ -n "$run_id" ] && gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 20 --json databaseId,status --jq '.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested") | .databaseId' 2>/dev/null || true)
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: readiness/RUL-2026-27-full-season-activation

      - name: Reset to latest authorised review branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git reset --hard "origin/$REVIEW_BRANCH"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"

      - name: Resolve and wait for latest explicitly dispatched finalizer
        id: finalizer
        shell: bash
        run: |
          set -euo pipefail
          encoded_branch=$(python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["REVIEW_BRANCH"],safe=""))')
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rules-readiness-final-orchestrator.yml/runs?branch=$encoded_branch&event=workflow_dispatch&per_page=30" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id')
          test -n "$run_id" -a "$run_id" != "null"
          for attempt in $(seq 1 80); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)
            if [ "$status" = completed ]; then break; fi
            sleep 90
          done
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)
          test "$status" = completed
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Materialise fixed-path verified handoff or durable failure evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/tickets/RUL-2026-27/review_handoff
          rm -rf "$OUT"
          mkdir -p "$OUT"
          run_id='${{ steps.finalizer.outputs.run_id }}'
          conclusion='${{ steps.finalizer.outputs.conclusion }}'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/FINALIZER_RUN.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/FINALIZER_JOBS.json"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > "$OUT/FINALIZER_FAILED.log" 2>&1 || true

          if [ "$conclusion" = success ]; then
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts | map(select(.name | startswith("DMF_PULSE_2026_27_RULESET_REVIEW_HANDOFF-"))) | sort_by(.created_at) | reverse | .[0].id')
            test -n "$artifact_id" -a "$artifact_id" != null
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/handoff-outer.zip"
            mkdir -p "$RUNNER_TEMP/handoff"
            unzip -q "$RUNNER_TEMP/handoff-outer.zip" -d "$RUNNER_TEMP/handoff"
            cp "$RUNNER_TEMP/handoff/DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip" "$OUT/"
            cp "$RUNNER_TEMP/handoff/DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip.sha256" "$OUT/"
            cp "$RUNNER_TEMP/handoff/DMF_PULSE_2026_27_RULESET_BUNDLE_ASSURANCE.json" "$OUT/"
            cp "$RUNNER_TEMP/handoff/FINAL_PUBLIC_HANDOFF.json" "$OUT/"
            python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          out = Path('evidence/tickets/RUL-2026-27/review_handoff')
          public = json.loads((out / 'FINAL_PUBLIC_HANDOFF.json').read_text(encoding='utf-8'))
          assurance = json.loads((out / 'DMF_PULSE_2026_27_RULESET_BUNDLE_ASSURANCE.json').read_text(encoding='utf-8'))
          bundle = out / 'DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip'
          sha_file = out / 'DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip.sha256'
          actual = hashlib.sha256(bundle.read_bytes()).hexdigest()
          expected = sha_file.read_text(encoding='utf-8').split()[0]
          with zipfile.ZipFile(bundle) as archive:
              archive_ok = archive.testzip() is None and 'MANIFEST.sha256' in archive.namelist()
              names = archive.namelist()
          prohibited = [name for name in names if any(part in name.split('/') for part in ('.git','.venv','__pycache__','.pytest_cache','.mypy_cache','.ruff_cache','node_modules'))]
          checks = {
              'bundle_exists': bundle.is_file(),
              'bundle_bytes': bundle.stat().st_size,
              'bundle_sha256': actual,
              'sha_file_matches': actual == expected == public['bundle_sha256'],
              'archive_test_passed': archive_ok,
              'manifest_passed': assurance['manifest_passed'] is True,
              'prohibited_file_count': len(prohibited),
              'final_commit': public['final_commit'],
              'remote_branch_verified': public['remote_branch_verified'] is True,
              'status': 'PASS',
          }
          if not all((
              public['assurance_status'] == 'PASS',
              assurance['status'] == 'PASS',
              checks['bundle_exists'],
              checks['bundle_bytes'] > 0,
              checks['sha_file_matches'],
              checks['archive_test_passed'],
              checks['manifest_passed'],
              checks['prohibited_file_count'] == 0,
              checks['remote_branch_verified'],
          )):
              checks['status'] = 'FAIL'
              (out / 'FIXED_PATH_ASSURANCE.json').write_text(json.dumps(checks, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              raise SystemExit('fixed-path handoff assurance failed')
          if checks['bundle_bytes'] >= 50 * 1024 * 1024:
              checks['status'] = 'FAIL'
              checks['error'] = 'bundle exceeds 50 MiB fixed-path publication limit'
              (out / 'FIXED_PATH_ASSURANCE.json').write_text(json.dumps(checks, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              raise SystemExit(checks['error'])
          (out / 'FIXED_PATH_ASSURANCE.json').write_text(json.dumps(checks, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          summary = f'''# DMF Pulse 2026/27 fixed-path review handoff

Status: **PASS**

Repository: `{public['repository']}`

Branch: `{public['branch']}`

Immutable parent: `{public['immutable_parent']}`

Final reviewed commit: `{public['final_commit']}`

Remote branch verified: `{public['remote_branch_verified']}`

Bundle: `{public['bundle_filename']}`

Bundle bytes: `{public['bundle_bytes']}`

Bundle SHA-256: `{public['bundle_sha256']}`

Assurance: `{public['assurance_status']}`

Human approval: `PENDING_HUMAN_APPROVAL`

Production activation: `BLOCKED`
'''
          (out / 'FINAL_STATUS.md').write_text(summary, encoding='utf-8')
          PY
          else
            python - <<'PY'
          import json
          from pathlib import Path
          out = Path('evidence/tickets/RUL-2026-27/review_handoff')
          run = json.loads((out / 'FINALIZER_RUN.json').read_text(encoding='utf-8'))
          jobs = json.loads((out / 'FINALIZER_JOBS.json').read_text(encoding='utf-8'))
          failed = [
              {'job': job['name'], 'step': step['name'], 'conclusion': step.get('conclusion')}
              for job in jobs.get('jobs', [])
              for step in job.get('steps', [])
              if step.get('conclusion') == 'failure'
          ]
          payload = {
              'schema_version': 'dmf-rules-fixed-handoff-failure-v1',
              'status': 'BLOCKED',
              'finalizer_run_id': run['id'],
              'finalizer_conclusion': run.get('conclusion'),
              'failed_steps': failed,
              'human_approval_status': 'PENDING_HUMAN_APPROVAL',
              'production_activation_status': 'BLOCKED',
          }
          (out / 'FINAL_FAILURE.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'FINAL_STATUS.md').write_text(
              '# DMF Pulse 2026/27 fixed-path review handoff\n\n'
              'Status: **BLOCKED**\n\n'
              f"Finalizer run: `{run['id']}`\n\n"
              f"Conclusion: `{run.get('conclusion')}`\n\n"
              'Partial product changes from the failed run were not accepted as a review bundle.\n\n'
              'Production activation remains `BLOCKED`.\n',
              encoding='utf-8',
          )
          PY
          fi

      - name: Commit fixed-path handoff and remove all temporary status workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/rules-readiness-status-export.yml \
            .github/workflows/rules-readiness-status-export-trigger.yml \
            .github/workflows/rules-readiness-fixed-handoff-publisher.yml \
            evidence/tickets/RUL-2026-27/tool_probe_success.tmp
          git config user.name "dmf-pulse-rules-readiness-bot"
          git config user.email "dmf-pulse-rules-readiness-bot@users.noreply.github.com"
          git add -A
          git commit -m "checkpoint(rules): finalize recoverable independent review handoff — publish fixed path"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"; then break; fi
            test "$attempt" != 3
            git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
            git rebase "origin/${REVIEW_BRANCH}"
          done
          local_head=$(git rev-parse HEAD)
          remote_head=$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | awk '{print $1}')
          test "$remote_head" = "$local_head"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"
