name: rules-readiness-final-preflight-v2

on:
  push:
    branches:
      - readiness/RUL-2026-27-full-season-activation
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: dmf-pulse-rul-2026-27-final-orchestrator
  cancel-in-progress: true

env:
  IMMUTABLE_PARENT: 4f1274ccef419a7c0bde335c48bd4070e248b2e6
  REVIEW_BRANCH: readiness/RUL-2026-27-full-season-activation
  GH_TOKEN: ${{ github.token }}

jobs:
  harden-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: readiness/RUL-2026-27-full-season-activation

      - name: Reset to remote review branch and prove immutable ancestry
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git reset --hard "origin/$REVIEW_BRANCH"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"
          git config user.name "dmf-pulse-rules-readiness-bot"
          git config user.email "dmf-pulse-rules-readiness-bot@users.noreply.github.com"

      - name: Revert any over-broad authoring checkpoint
        shell: bash
        run: |
          set -euo pipefail
          report=evidence/tickets/RUL-2026-27/TARGET_AUTHORING_REPORT.json
          bad=0
          if [ -f "$report" ]; then
            python - <<'PY' || bad=1
          import json
          from pathlib import Path
          value = json.loads(Path("evidence/tickets/RUL-2026-27/TARGET_AUTHORING_REPORT.json").read_text(encoding="utf-8"))
          root = str(value.get("target_root", ""))
          if root in {"", "."} or "rules" not in root.lower():
              raise SystemExit(1)
          PY
          fi
          if [ "$bad" = 1 ]; then
            mapfile -t commits < <(git log --format='%H%x09%s' "$IMMUTABLE_PARENT..HEAD" | awk -F '\t' '$2 ~ /^checkpoint\(rules\): (complete 2026\/27 target authoring|add 2026\/27 adversarial|record final 2026\/27 validation|finalize recoverable)/ {print $1}')
            for commit in "${commits[@]}"; do
              git revert --no-edit "$commit"
            done
          fi

      - name: Correct target and reference split-YAML discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/author_2026_27_ruleset.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"def _candidate_roots\(repo: Path, season: str, target: bool\) -> list\[tuple\[int, Path\]\]:\n"
              r".*?\n\n\ndef discover_ruleset",
              re.DOTALL,
          )
          replacement = '''def _candidate_roots(repo: Path, season: str, target: bool) -> list[tuple[int, Path]]:
    scores: dict[Path, int] = {}
    counts: dict[Path, int] = {}
    for path in _yaml_files(repo):
        score = _season_score(path, season, target)
        if score <= 0:
            continue
        parent = path.parent
        if parent == repo.parent or not parent.is_relative_to(repo):
            continue
        scores[parent] = scores.get(parent, 0) + score
        counts[parent] = counts.get(parent, 0) + 1
    candidates = [
        (score + min(counts[root], 10), root)
        for root, score in scores.items()
        if counts[root] >= 1
    ]
    return sorted(candidates, key=lambda item: (-item[0], -item[1].as_posix().lower().count("target"), item[1].as_posix()))


def discover_ruleset'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("unable to replace authoring ruleset discovery")
          path.write_text(updated, encoding="utf-8")

          workflow = Path(".github/workflows/rules-readiness-final-orchestrator.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          workflow_text = workflow_text.replace(
              'uv run pytest -m "postgres and integration" tests/integration --maxfail=1',
              'uv run pytest -m "postgres" tests/integration --maxfail=1',
          )
          workflow_text = workflow_text.replace(
              '"uv run pytest -m \'postgres and integration\' tests/integration",',
              '"uv run pytest -m \'postgres\' tests/integration",',
          )
          workflow.write_text(workflow_text, encoding="utf-8")
          PY
          rm -f .github/workflows/rules-readiness-final-preflight-v2.yml
          git diff --check

      - name: Commit and push hardening without force
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(rules): constrain target authoring to the discovered split ruleset"
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"; then break; fi
            test "$attempt" != 3
            git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
            git rebase "origin/${REVIEW_BRANCH}"
          done
          test "$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"

      - name: Dispatch the corrected final orchestrator
        run: |
          set -euo pipefail
          gh workflow run rules-readiness-final-orchestrator.yml --repo "$GITHUB_REPOSITORY" --ref "$REVIEW_BRANCH"
