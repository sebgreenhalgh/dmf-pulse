name: rules-readiness-author

on:
  push:
    branches:
      - readiness/RUL-2026-27-full-season-activation
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_NO_PROGRESS: "1"
  IMMUTABLE_PARENT: 4f1274ccef419a7c0bde335c48bd4070e248b2e6

jobs:
  author:
    if: ${{ !contains(github.event.head_commit.message || '', 'checkpoint(rules): complete 2026/27 target authoring') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: readiness/RUL-2026-27-full-season-activation

      - name: Prove immutable implementation ancestry
        run: |
          set -euo pipefail
          git cat-file -e "${IMMUTABLE_PARENT}^{commit}"
          test "$(git merge-base "${IMMUTABLE_PARENT}" HEAD)" = "${IMMUTABLE_PARENT}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frozen project environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv sync --all-groups --frozen

      - name: Reconcile official bootstrap and author recognised target fields
        id: author
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/rules-readiness-author
          set +e
          uv run python scripts/author_2026_27_ruleset.py --repo-root . \
            > artifacts/rules-readiness-author/author_stdout.json \
            2> artifacts/rules-readiness-author/author_stderr.txt
          rc=$?
          set -e
          echo "returncode=$rc" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('evidence/tickets/RUL-2026-27/TARGET_AUTHORING_REPORT.json')
          if report.exists():
              payload = json.loads(report.read_text(encoding='utf-8'))
              Path('artifacts/rules-readiness-author/target_root.txt').write_text(payload['target_root'] + '\n')
          PY

      - name: Run target compiler and accepted reference regressions when authoring closes
        if: ${{ steps.author.outputs.returncode == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(cat artifacts/rules-readiness-author/target_root.txt)
          uv run dmf rules --help > artifacts/rules-readiness-author/rules_help.txt
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          target = Path('artifacts/rules-readiness-author/target_root.txt').read_text().strip()
          attempts = [
              ['uv','run','dmf','rules','validate',target,'--json'],
              ['uv','run','dmf','rules','validate','--source',target,'--json'],
              ['uv','run','dmf','rules','validate','--ruleset',target,'--json'],
          ]
          ledger = []
          passed = None
          for argv in attempts:
              result = subprocess.run(argv, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              ledger.append({'argv': argv, 'returncode': result.returncode, 'stdout': result.stdout, 'stderr': result.stderr})
              if result.returncode == 0:
                  passed = argv
                  break
          Path('artifacts/rules-readiness-author/target_validate_attempts.json').write_text(
              json.dumps(ledger, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if passed is None:
              raise SystemExit('target validation failed for all CLI forms; see target_validate_attempts.json')
          Path('artifacts/rules-readiness-author/validated_command.json').write_text(
              json.dumps({'argv': passed}, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          uv run pytest -q \
            tests/unit/rules \
            tests/contract/rules \
            tests/golden/rules \
            --maxfail=1 \
            | tee artifacts/rules-readiness-author/focused_rules_tests.txt
          uv run ruff format --check . | tee artifacts/rules-readiness-author/ruff_format.txt
          uv run ruff check . | tee artifacts/rules-readiness-author/ruff_lint.txt
          uv run mypy src/dmf_pulse | tee artifacts/rules-readiness-author/mypy.txt
          git diff --check

      - name: Persist milestone report even when target remains blocked
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          rc = int('${{ steps.author.outputs.returncode }}')
          report_path = Path('evidence/tickets/RUL-2026-27/TARGET_AUTHORING_REPORT.json')
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          payload = {
              'schema_version': 'dmf-rules-authoring-checkpoint-v1',
              'base_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'author_returncode': rc,
              'author_status': report.get('status', 'NO_REPORT'),
              'missing_semantics': report.get('missing_semantics', []),
              'unresolved_placeholder_count': len(report.get('unresolved_placeholders', [])),
              'status': 'PASS' if rc == 0 else 'BLOCKED',
          }
          Path('artifacts/rules-readiness-author/checkpoint_status.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "dmf-pulse-rules-readiness-bot"
          git config user.email "dmf-pulse-rules-readiness-bot@users.noreply.github.com"
          git add -A
          if [ "${{ steps.author.outputs.returncode }}" = "0" ]; then
            rm -f .github/workflows/rules-readiness-author.yml
            git add -A
            git commit -m "checkpoint(rules): complete 2026/27 target authoring"
          else
            rm -f .github/workflows/rules-readiness-author.yml
            git add -A
            git commit -m "checkpoint(rules): record blocked 2026/27 target authoring"
          fi
          git push origin HEAD:readiness/RUL-2026-27-full-season-activation
          remote=$(git ls-remote origin refs/heads/readiness/RUL-2026-27-full-season-activation | awk '{print $1}')
          test "$remote" = "$(git rev-parse HEAD)"

      - name: Fail workflow after durable blocked checkpoint
        if: ${{ steps.author.outputs.returncode != '0' }}
        run: |
          echo "Target authoring remains blocked; durable evidence was pushed." >&2
          exit 1
