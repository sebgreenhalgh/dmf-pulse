name: Stage 15 temporary publisher

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-publish.yml

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkpoint 15.06 payload
        shell: bash
        run: |
          set -euo pipefail
          cat recovery/stage1506/part-*.b64 > /tmp/stage1506.patch.gz.b64
          test "$(wc -c < /tmp/stage1506.patch.gz.b64)" -eq 40164
          echo "c3b4529597c078520fa365a94fd97e6800d35820814c4e2152e9bae04e51bd0a  /tmp/stage1506.patch.gz.b64" | sha256sum --check
          base64 -d /tmp/stage1506.patch.gz.b64 > /tmp/stage1506.patch.gz
          gzip -t /tmp/stage1506.patch.gz
          gzip -dc /tmp/stage1506.patch.gz > /tmp/stage1506.patch
          echo "b0544d83473fb4b94b3eff73c5faf20466363200b4623a5294cae08a779dd43a  /tmp/stage1506.patch" | sha256sum --check
          git apply --check --whitespace=error /tmp/stage1506.patch
          git apply --index --whitespace=error /tmp/stage1506.patch
          git diff --cached --check

      - name: Commit and push checkpoint 15.06
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sebastian Greenhalgh"
          git config user.email "seb.greenhalgh@outlook.com"
          git commit -m "feat(rank): seal checkpoint 15.06 shared service and CLI"
          git push origin HEAD:stage/A15/RANK-015-rank-aware-strategy

      - name: Report publisher result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh issue comment 14 --body \
            "STAGE15_1506_PUBLISH run_id=${GITHUB_RUN_ID} status=${JOB_STATUS} head_sha=${head_sha} trigger_sha=${GITHUB_SHA}"
