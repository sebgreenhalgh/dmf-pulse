name: Stage 15 temporary publisher

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and publish sealed checkpoint 15.05
        shell: bash
        run: |
          set -euo pipefail
          cat recovery/stage1505/part-*.b64 | base64 -d | gzip -d > /tmp/checkpoint.patch
          git apply --index --whitespace=error /tmp/checkpoint.patch
          git diff --cached --check
          git config user.name "Sebastian Greenhalgh"
          git config user.email "seb.greenhalgh@outlook.com"
          git commit -m "feat(rank): seal checkpoint 15.05 synthetic cohort"
          git push origin HEAD:stage/A15/RANK-015-rank-aware-strategy
