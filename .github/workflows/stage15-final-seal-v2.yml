name: Stage 15 minimal final seal publisher

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-final-seal-v2.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: stage15-minimal-final-seal-v2
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: stage/A15/RANK-015-rank-aware-strategy
      BASE_SHA: 0a16ebaf6376c2347845ae9bb7804433fe6823e4
      PAYLOAD_SOURCE_SHA: 0820dbbb3f3825877758589d2e2eb185b1e6b884
      IMMUTABLE_MAIN: c53a1dfae952f481c1e885200ebf6120e4b63c24
      CHECKPOINT_1506: c77b8950a4a150407b51d9bfed69b2314c74380e
      EXPECTED_TREE: d5020443f87858776d8750d7b6ea267445856dba
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact trigger
        uses: actions/checkout@v4
        with:
          ref: stage/A15/RANK-015-rank-aware-strategy
          fetch-depth: 0

      - name: Report start and verify branch authority
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 14 --body "STAGE15_FINAL_SEAL_START run_id=${GITHUB_RUN_ID} trigger_sha=${GITHUB_SHA}"
          git fetch origin --prune
          test "$(git rev-parse origin/main)" = "$IMMUTABLE_MAIN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git cat-file -e "$CHECKPOINT_1506:src/dmf_pulse/rank_strategy/service.py"

      - name: Materialise exact locally verified tree
        shell: bash
        run: |
          set -euo pipefail
          git show "$PAYLOAD_SOURCE_SHA":.github/workflows/stage15-terminal-finalizer.yml \
            | sed -n 's/^\(H4sI.*\)$/\1/p' > /tmp/rank015-docs.patch.gz.b64
          test "$(sha256sum /tmp/rank015-docs.patch.gz.b64 | cut -d' ' -f1)" = "334f1f049b0558815271c6fb1acf5ec4b1f4b94ae75e49e6b827899b3e5acbc4"
          base64 -d /tmp/rank015-docs.patch.gz.b64 > /tmp/rank015-docs.patch.gz
          gzip -dc /tmp/rank015-docs.patch.gz > /tmp/rank015-docs.patch
          git read-tree --reset -u "$BASE_SHA"
          git apply --index --whitespace=error /tmp/rank015-docs.patch
          git rm -r --ignore-unmatch -- \
            .github/workflows/stage15-publish.yml \
            .github/workflows/stage15-source-export.yml \
            .github/workflows/stage15-terminal-finalizer.yml \
            .github/workflows/stage15-validation.yml \
            .github/workflows/stage15-final-seal-v2.yml \
            recovery/stage1505 recovery/stage1506

      - name: Install immutable environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run cleaned-tree final gates
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          uv run python scripts/generate_repository_manifest.py --ticket PRC-013
          git add -- evidence/tickets/PRC-013/current_manifest.json
          git diff --check
          uv run python scripts/validate_repository.py
          uv run python scripts/scan_secrets.py
          uv run pytest \
            tests/unit/rank_strategy/test_service.py \
            tests/unit/rank_strategy/test_artifacts.py \
            tests/unit/cli/test_rank_cli.py \
            tests/integration/rank_strategy/test_exact_mini_league.py \
            tests/integration/rank_strategy/test_synthetic_overall_field.py -q
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'stage15-*' -print)"
          test ! -e recovery
          test -z "$(git diff --name-only)"
          git diff --cached --check
          actual_tree=$(git write-tree)
          test "$actual_tree" = "$EXPECTED_TREE"

      - name: Commit and push final sealed tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sebastian Greenhalgh"
          git config user.email "seb.greenhalgh@outlook.com"
          git commit -m "chore(rank): seal Stage 15 final review tree"
          git push origin HEAD:"$BRANCH"
          final_sha=$(git rev-parse HEAD)
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          test "$final_sha" = "$remote_sha"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          git branch -f stage15-final-bundle "$final_sha"
          git bundle create /tmp/dmf-pulse-stage15-final.bundle refs/heads/stage15-final-bundle

      - name: Upload final Git bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stage15-final-bundle-${{ github.run_id }}
          path: /tmp/dmf-pulse-stage15-final.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Report durable success
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 14 --body "STAGE15_FINAL_SEAL run_id=${GITHUB_RUN_ID} status=success final_sha=${{ steps.publish.outputs.final_sha }} tree_sha=${EXPECTED_TREE} checkpoint_15_06=${CHECKPOINT_1506} tests=243 raw_branch_coverage=91.334895 inherited=37 cleanup=PASS main=${IMMUTABLE_MAIN} artifact_id=${{ steps.upload.outputs.artifact-id }}"

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          gh issue comment 14 --body "STAGE15_FINAL_SEAL run_id=${GITHUB_RUN_ID} status=failure trigger_sha=${GITHUB_SHA} resume_sha=$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH --jq .object.sha)"
