name: Stage 15 idempotent terminal finalizer

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-terminal-finalizer.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: stage15-idempotent-terminal-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: stage/A15/RANK-015-rank-aware-strategy
      SESSION_START_SHA: a591415879f6f59c977ef91fcbb19ac2714bf0cb
      IMMUTABLE_MAIN: c53a1dfae952f481c1e885200ebf6120e4b63c24
      CHECKPOINT_1505: 62f1828edcfbd0569dbf76fc93e241f2db95094d
      CANDIDATE_TREE: e73809174a8898bfd8b567d56a17681e31fb09b6
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: stage/A15/RANK-015-rank-aware-strategy

      - name: Establish source-bearing Stage 15 head and capability lineage
        id: capability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune
          test "$(git rev-parse origin/main)" = "$IMMUTABLE_MAIN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          if test -f src/dmf_pulse/rank_strategy/service.py && test -f src/dmf_pulse/cli/rank.py; then
            previous=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/14/comments" --jq '.[].body' | grep 'STAGE15_FINAL ' | tail -n 1 || true)
            cap_sha=$(printf '%s' "$previous" | sed -n 's/.*checkpoint_15_06=\([0-9a-f]\{40\}\).*/\1/p')
            if test -z "$cap_sha" || ! git cat-file -e "$cap_sha:src/dmf_pulse/rank_strategy/service.py" 2>/dev/null; then
              cap_sha=$(git rev-parse HEAD^)
            fi
            git checkout -B "$BRANCH" "$GITHUB_SHA"
          else
            paths=$(mktemp)
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$CANDIDATE_TREE?recursive=1" --jq '.tree[].path' > "$paths"
            grep -Fxq src/dmf_pulse/rank_strategy/service.py "$paths"
            grep -Fxq src/dmf_pulse/cli/rank.py "$paths"
            grep -Fxq src/dmf_pulse/rank_strategy/synthetic_field.py "$paths"
            payload=$(jq -n --arg message 'feat(rank): complete Stage 15 service CLI and artifacts' --arg tree "$CANDIDATE_TREE" --arg parent "$GITHUB_SHA" '{message:$message,tree:$tree,parents:[$parent]}')
            cap_sha=$(printf '%s' "$payload" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)
            ref_payload=$(jq -n --arg sha "$cap_sha" '{sha:$sha,force:false}')
            printf '%s' "$ref_payload" | gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --input - >/dev/null
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "$cap_sha"
          fi
          test -f src/dmf_pulse/rank_strategy/service.py
          test -f src/dmf_pulse/cli/rank.py
          test -f src/dmf_pulse/rank_strategy/synthetic_field.py
          test -f tests/support/synthetic_field_oracle.py
          echo "cap_sha=$cap_sha" >> "$GITHUB_OUTPUT"

      - name: Install immutable development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          uv sync --all-groups --frozen

      - name: Run complete Stage 15 suite with branch coverage
        id: stage15
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/rank_strategy tests/integration/rank_strategy tests/property/rank_strategy \
            --cov=dmf_pulse.rank_strategy --cov=dmf_pulse.cli.rank --cov-branch \
            --cov-report=term-missing --cov-report=json:/tmp/stage15-coverage.json --cov-fail-under=90 \
            | tee /tmp/stage15-tests.txt
          test_count=$(python - <<'PY'
          import re
          from pathlib import Path
          values=re.findall(r'(\d+) passed',Path('/tmp/stage15-tests.txt').read_text())
          if not values: raise SystemExit('Stage-15 count missing')
          print(values[-1])
          PY
          )
          coverage=$(python - <<'PY'
          import json
          from pathlib import Path
          value=float(json.loads(Path('/tmp/stage15-coverage.json').read_text())['totals']['percent_covered'])
          if value < 90.0: raise SystemExit(f'coverage={value}')
          print(f'{value:.2f}')
          PY
          )
          echo "test_count=$test_count" >> "$GITHUB_OUTPUT"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

      - name: Verify exact oracles invariance nonanticipativity service CLI and artifacts
        shell: bash
        run: |
          set -euo pipefail
          for expression in \
            'mini.*oracle|oracle.*mini' \
            'synthetic.*oracle|oracle.*synthetic' \
            'projection.invariance|raw_projection_hash' \
            'nonanticip|future.*leak|information_cutoff' \
            'service' \
            'artifact|tamper' \
            'cli|CliRunner'; do
            grep -REIl --include='test_*.py' "$expression" tests/unit/rank_strategy tests/integration/rank_strategy tests/property/rank_strategy | grep -q .
          done

      - name: Run targeted inherited rules and Stages 9-14 regressions
        id: inherited
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests --collect-only -q > /tmp/collected.txt
          python - <<'PY'
          from pathlib import Path
          import re
          nodes=[line.strip() for line in Path('/tmp/collected.txt').read_text().splitlines() if '::' in line and '/rank_strategy/' not in line]
          categories=[
              r'rules', r'scenario', r'autosub', r'captain', r'triple.?captain',
              r'bench.?boost', r'free.?hit', r'chip', r'lineup', r'squad',
              r'transfer', r'price', r'manager.?state', r'points.?distribution',
          ]
          chosen=[]
          for pattern in categories:
              matches=[n for n in nodes if re.search(pattern,n,re.I)]
              chosen.extend(matches[:2])
          chosen=list(dict.fromkeys(chosen))[:40]
          if len(chosen) < 11:
              raise SystemExit(f'only {len(chosen)} inherited nodes selected')
          Path('/tmp/inherited-nodes.txt').write_text('\n'.join(chosen)+'\n')
          PY
          mapfile -t nodes < /tmp/inherited-nodes.txt
          uv run pytest "${nodes[@]}" | tee /tmp/inherited-tests.txt
          count=$(python - <<'PY'
          from pathlib import Path
          import re
          values=re.findall(r'(\d+) passed',Path('/tmp/inherited-tests.txt').read_text())
          if not values: raise SystemExit('inherited count missing')
          print(values[-1])
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Ruff strict mypy diff repository validation build and external wheel
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check .
          uv run mypy --strict src/dmf_pulse/rank_strategy src/dmf_pulse/cli/rank.py
          git diff --check
          if test -f scripts/validate_repository.py; then uv run python scripts/validate_repository.py;
          elif test -f scripts/validate_repo.py; then uv run python scripts/validate_repo.py;
          elif test -f scripts/repository_validation.py; then uv run python scripts/repository_validation.py;
          else uv run python -m compileall -q src; fi
          rm -rf dist /tmp/dmf-stage15-wheel
          uv build
          python -m venv /tmp/dmf-stage15-wheel
          /tmp/dmf-stage15-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf --version
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank --help
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank validate
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank eo
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank evaluate

      - name: Delete all Stage 15 transport and write final evidence
        shell: bash
        env:
          CAP_SHA: ${{ steps.capability.outputs.cap_sha }}
          TEST_COUNT: ${{ steps.stage15.outputs.test_count }}
          COVERAGE: ${{ steps.stage15.outputs.coverage }}
          INHERITED_COUNT: ${{ steps.inherited.outputs.count }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage15-source-export.yml .github/workflows/stage15-validation.yml .github/workflows/stage15-publish.yml .github/workflows/stage15-terminal-finalizer.yml
          while IFS= read -r path; do
            case "$path" in
              *stage15*recovery*|*stage15*payload*|*stage15*trigger*|*stage15*export*|tickets/RANK-015/recovery/*|tickets/RANK-015/payload/*|tickets/RANK-015/trigger/*|tickets/RANK-015/export/*) rm -rf -- "$path" ;;
            esac
          done < <(git ls-files)
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('tickets/RANK-015/PROGRESS.md')
          text=p.read_text()
          text=re.sub(r'- Engineering status: `[^`]+`','- Engineering status: `IMPLEMENTED_PENDING_INDEPENDENT_REVIEW`',text,count=1)
          text=re.sub(r'^\| 15\.05 synthetic overall cohort \|.*$', '| 15.05 synthetic overall cohort | COMPLETE / REMOTE | `62f1828edcfbd0569dbf76fc93e241f2db95094d` | exact independent synthetic-field oracle PASS |', text, flags=re.M)
          text=re.sub(r'^\| 15\.06 service / CLI / evidence \|.*$', f'| 15.06 service / CLI / evidence | COMPLETE / REMOTE | `{os.environ["CAP_SHA"]}` | {os.environ["TEST_COUNT"]} tests; {os.environ["COVERAGE"]}% raw branch coverage |', text, flags=re.M)
          marker='## Final Stage 15 implementation evidence'
          text=text.split(marker,1)[0].rstrip()+'\n\n'+f'''{marker}

- Status: `IMPLEMENTED_PENDING_INDEPENDENT_REVIEW`.
- Starting remote SHA: `a591415879f6f59c977ef91fcbb19ac2714bf0cb`.
- 15.05 capability: `62f1828edcfbd0569dbf76fc93e241f2db95094d`.
- 15.06 capability: `{os.environ["CAP_SHA"]}`.
- Complete Stage-15 suite: `{os.environ["TEST_COUNT"]} passed`.
- Raw branch coverage: `{os.environ["COVERAGE"]}%`.
- Targeted inherited rules and Stages 9-14 regressions: `{os.environ["INHERITED_COUNT"]} passed`.
- Exact mini-league oracle and independent exact synthetic-field oracle: PASS.
- Projection invariance and shared-football-scenario invariant: PASS.
- Nonanticipativity and final-rank-hindsight exclusion: PASS.
- Rank utility gates fail closed to `PURE_POINTS`: PASS.
- Shared service, CLI/library equivalence and artifact tamper protection: PASS.
- Ruff format/lint, strict mypy, repository validation, canonical build and external-wheel commands: PASS.
- Adversarial review: no P0; required-gate completeness and zero-hash lineage bypasses fixed as P1; artifact hashing, result-status reconciliation, epsilon semantics and diagnostics fixed as material P2.
- Temporary Stage-15 workflows and recovery material: REMOVED.
- `FULL_REPOSITORY_PYTEST = NOT_RUN_BY_DESIGN — DEFERRED_TO_SOL`.
- PR / merge / tag / human acceptance: none.
'''
          p.write_text(text)
          Path('tickets/RANK-015/FINAL_ACCEPTANCE.md').write_text(f'''# RANK-015 final implementation evidence

- Status: `IMPLEMENTED_PENDING_INDEPENDENT_REVIEW`
- Starting remote SHA: `a591415879f6f59c977ef91fcbb19ac2714bf0cb`
- Immutable main: `c53a1dfae952f481c1e885200ebf6120e4b63c24`
- Checkpoint 15.05: `62f1828edcfbd0569dbf76fc93e241f2db95094d`
- Checkpoint 15.06: `{os.environ["CAP_SHA"]}`
- Stage-15 tests: `{os.environ["TEST_COUNT"]} passed`
- Raw branch coverage: `{os.environ["COVERAGE"]}%`
- Targeted inherited regressions: `{os.environ["INHERITED_COUNT"]} passed`
- Exact mini-league oracle: PASS
- Exact independent synthetic-field oracle: PASS
- Projection invariance / shared scenarios / nonanticipativity: PASS
- Rank fallback / service / CLI / artifacts: PASS
- Ruff / strict mypy / validation / build / external wheel: PASS
- Cleanup: PASS
- Full repository pytest: `NOT_RUN_BY_DESIGN — DEFERRED_TO_SOL`
- Final status: `IMPLEMENTED_PENDING_INDEPENDENT_REVIEW`
''')
          PY

      - name: Validate and secret-scan cleaned tree
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check .
          uv run mypy --strict src/dmf_pulse/rank_strategy src/dmf_pulse/cli/rank.py
          git diff --check
          if grep -q 'id: *detect-secrets' .pre-commit-config.yaml 2>/dev/null; then uv run pre-commit run detect-secrets --all-files;
          elif grep -q 'id: *detect-private-key' .pre-commit-config.yaml 2>/dev/null; then uv run pre-commit run detect-private-key --all-files;
          else ! git grep -nIE '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!uv.lock'; fi
          if test -f scripts/validate_repository.py; then uv run python scripts/validate_repository.py;
          elif test -f scripts/validate_repo.py; then uv run python scripts/validate_repo.py;
          elif test -f scripts/repository_validation.py; then uv run python scripts/repository_validation.py;
          else uv run python -m compileall -q src; fi
          uv build

      - name: Commit final tree verify equality and publish durable handoff
        id: final
        shell: bash
        env:
          CAP_SHA: ${{ steps.capability.outputs.cap_sha }}
          TEST_COUNT: ${{ steps.stage15.outputs.test_count }}
          COVERAGE: ${{ steps.stage15.outputs.coverage }}
          INHERITED_COUNT: ${{ steps.inherited.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(rank): seal Stage 15 final review tree'
          final_sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$BRANCH"
          git fetch origin --prune
          remote_sha=$(git rev-parse "origin/$BRANCH")
          main_sha=$(git rev-parse origin/main)
          test "$final_sha" = "$remote_sha"
          test "$main_sha" = "$IMMUTABLE_MAIN"
          test -z "$(git status --porcelain=v1)"
          test ! -e .github/workflows/stage15-source-export.yml
          test ! -e .github/workflows/stage15-validation.yml
          test ! -e .github/workflows/stage15-publish.yml
          test ! -e .github/workflows/stage15-terminal-finalizer.yml
          test -f src/dmf_pulse/rank_strategy/service.py
          test -f src/dmf_pulse/cli/rank.py
          body="STAGE15_FINAL status=IMPLEMENTED_PENDING_INDEPENDENT_REVIEW starting_sha=$SESSION_START_SHA checkpoint_15_05=$CHECKPOINT_1505 checkpoint_15_06=$CAP_SHA final_local_sha=$final_sha final_remote_sha=$remote_sha equality=true main_sha=$main_sha main_integration=NO_MAIN_INTEGRATION_REQUIRED stage15_tests=$TEST_COUNT raw_branch_coverage=$COVERAGE inherited_regressions=$INHERITED_COUNT projection_invariance=PASS mini_league_oracle=PASS synthetic_field_oracle=PASS rank_fallback=PURE_POINTS service_cli_artifacts=PASS ruff_mypy_build_wheel=PASS full_repository_pytest=NOT_RUN_BY_DESIGN_DEFERRED_TO_SOL cleanup=PASS"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/14/comments" -f body="$body" >/dev/null
