name: Stage 15 final seal publisher

on:
  push:
    branches:
      - stage/A15/RANK-015-rank-aware-strategy
    paths:
      - .github/workflows/stage15-terminal-finalizer.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: stage15-final-seal-publisher
  cancel-in-progress: false

jobs:
  final-seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: stage/A15/RANK-015-rank-aware-strategy
      BASE_SHA: 0a16ebaf6376c2347845ae9bb7804433fe6823e4
      IMMUTABLE_MAIN: c53a1dfae952f481c1e885200ebf6120e4b63c24
      CHECKPOINT_1506: c77b8950a4a150407b51d9bfed69b2314c74380e
      EXPECTED_TREE: d5020443f87858776d8750d7b6ea267445856dba
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: stage/A15/RANK-015-rank-aware-strategy
          fetch-depth: 0

      - name: Verify canonical starting state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune
          test "$(git rev-parse origin/main)" = "$IMMUTABLE_MAIN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -f src/dmf_pulse/rank_strategy/service.py
          test -f src/dmf_pulse/rank_strategy/service_models.py
          test -f src/dmf_pulse/rank_strategy/artifacts.py
          test -f src/dmf_pulse/rank_strategy/synthetic_field.py
          test -f src/dmf_pulse/cli/rank.py

      - name: Materialise the locally verified final tree
        shell: bash
        run: |
          set -euo pipefail
          git read-tree --reset -u "$BASE_SHA"
          cat > /tmp/rank015-docs.patch.gz.b64 <<'B64'

B64
          test "$(sha256sum /tmp/rank015-docs.patch.gz.b64 | cut -d' ' -f1)" = "334f1f049b0558815271c6fb1acf5ec4b1f4b94ae75e49e6b827899b3e5acbc4"
          base64 -d /tmp/rank015-docs.patch.gz.b64 > /tmp/rank015-docs.patch.gz
          gzip -dc /tmp/rank015-docs.patch.gz > /tmp/rank015-docs.patch
          git apply --index --whitespace=error /tmp/rank015-docs.patch
          git rm -r --ignore-unmatch -- \
            .github/workflows/stage15-publish.yml \
            .github/workflows/stage15-source-export.yml \
            .github/workflows/stage15-terminal-finalizer.yml \
            .github/workflows/stage15-validation.yml \
            recovery/stage1505 recovery/stage1506

      - name: Synchronise frozen environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frozen project
        shell: bash
        run: uv sync --all-groups --frozen

      - name: Run complete Stage 15 suite and branch gate
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/rank_strategy tests/property/rank_strategy \
            tests/integration/rank_strategy tests/unit/cli/test_rank_cli.py \
            --cov=dmf_pulse.rank_strategy --cov=dmf_pulse.cli.rank --cov-branch \
            --cov-report=term-missing --cov-report=json:/tmp/stage15-coverage.json \
            --cov-fail-under=90 -q | tee /tmp/stage15-tests.txt
          grep -Eq '243 passed' /tmp/stage15-tests.txt
          uv run python - <<'PY'
          import json
          from pathlib import Path
          totals=json.loads(Path('/tmp/stage15-coverage.json').read_text())['totals']
          assert totals['covered_branches'] == 780
          assert totals['num_branches'] == 854
          assert 100 * totals['covered_branches'] / totals['num_branches'] >= 90
          PY

      - name: Run exact inherited regression matrix
        shell: bash
        run: |
          set -euo pipefail
          nodes=(
            'tests/unit/rules/test_one_gameweek.py::test_reference_rules_view_is_resolved_from_compiled_values'
            'tests/unit/rules/test_one_gameweek.py::test_current_target_remains_blocked_for_test_and_production'
            'tests/unit/fpl_points/test_rules_and_scoring.py::test_appearance_clean_sheet_goal_and_assist_components_are_exact'
            'tests/property/fpl_points/test_properties.py::test_fixture_pmf_threshold_quantile_and_mapping_properties'
            'tests/property/fpl_points/test_properties.py::test_double_gameweek_total_equals_fixture_scenario_sum'
            'tests/property/optimisation/test_oracle_equivalence.py::test_independent_oracle_matches_every_scenario_score'
            'tests/property/optimisation/test_oracle_equivalence.py::test_independent_exhaustive_oracle_matches_exact_global_optimum'
            'tests/unit/optimisation/test_multi_gameweek_tree.py::test_future_actions_recourse_only_after_revelation'
            'tests/unit/optimisation/test_multi_gameweek_tree.py::test_clairvoyant_root_policy_is_not_representable'
            'tests/unit/optimisation/test_multi_gameweek_state.py::test_selling_price_retains_floor_half_profit_and_full_loss'
            'tests/unit/optimisation/test_multi_gameweek_state.py::test_free_transfer_banking_consumption_hits_and_boundaries'
            'tests/unit/evaluation/test_leakage.py::test_required_adversarial_leakage_cases_block'
            'tests/unit/evaluation/test_information_and_vintages.py::test_strict_live_includes_only_live_operational'
            'tests/unit/evaluation/test_information_and_vintages.py::test_strict_live_blocks_every_nonoperational_mode_instead_of_silent_exclusion'
            'tests/unit/prices/test_paths_selling.py::test_complete_recurrent_path_distribution_is_deterministic_and_integer'
            'tests/unit/prices/test_paths_selling.py::test_stage11_selling_value_is_exact_across_profit_and_loss_paths'
            'tests/unit/prices/test_decisions_evaluation_artifacts.py::test_act_wait_uses_complete_utility_not_probability_threshold'
            'tests/unit/prices/test_decisions_evaluation_artifacts.py::test_evaluation_rejects_future_labels_and_nonchronological_rows'
            'tests/unit/chips/test_captaincy.py::test_captain_absent_vice_appears'
            'tests/unit/chips/test_bench_boost.py::test_autosub_overlap_is_subtracted_from_bench_sum'
            'tests/unit/chips/test_free_hit.py::test_permanent_squad_bank_and_purchase_prices_restore_exactly'
            'tests/unit/chips/test_free_hit.py::test_common_scenario_mismatch_and_duplicate_candidates_fail_closed'
            'tests/unit/chips/test_temporal_leakage.py::test_executable_service_rejects_every_future_information_class'
          )
          uv run pytest "${nodes[@]}" -q | tee /tmp/inherited.txt
          grep -Eq '37 passed' /tmp/inherited.txt

      - name: Run static, repository and security gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy --strict src/dmf_pulse
          uv run python scripts/generate_repository_manifest.py --ticket PRC-013
          git add -- evidence/tickets/PRC-013/current_manifest.json
          git diff --check
          uv run python scripts/validate_repository.py
          uv run python scripts/scan_secrets.py
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'stage15-*' -print)"
          test ! -e recovery

      - name: Build and exercise pristine external wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/dmf-stage15-wheel /tmp/rank015-inputs /tmp/rank015-artifacts
          uv build --clear
          mkdir -p /tmp/rank015-inputs
          uv run python - <<'PY'
          from pathlib import Path
          from dmf_pulse.evaluation.artifacts import canonical_json_bytes
          from tests.support.rank_service_fixtures import service_request, write_service_request
          from tests.support.rank_strategy_fixtures import cohort, manager_plan, multiplier_policy, rank_players, rank_rules, scenario_set
          root=Path('/tmp/rank015-inputs')
          request=service_request()
          write_service_request(root/'service-request.json', request)
          sebastian=manager_plan('sebastian', captain='p12')
          rival=manager_plan('rival', captain='p13')
          sample=cohort(sebastian, rival)
          scenarios=scenario_set({'p12':8,'p13':2},{'p12':1,'p13':9},weights=(0.4,0.6))
          players=rank_players(); rules=rank_rules(); policy=multiplier_policy()
          payload={
              'sample': sample.model_dump(mode='json'),
              'scenario_set': scenarios.model_dump(mode='json'),
              'players': {k:v.model_dump(mode='json') for k,v in players.items()},
              'rules': rules.model_dump(mode='json'),
              'policy': policy.model_dump(mode='json'),
              'sebastian_plan': sebastian.model_dump(mode='json'),
          }
          (root/'eo.json').write_bytes(canonical_json_bytes(payload))
          PY
          uv run python -m venv /tmp/dmf-stage15-wheel
          source_site=$(uv run python -c 'import site; print(site.getsitepackages()[0])')
          target_site=$(/tmp/dmf-stage15-wheel/bin/python -c 'import site; print(site.getsitepackages()[0])')
          uv run python - "$source_site" "$target_site" <<'PY'
          import shutil, sys
          from pathlib import Path
          source, target = map(Path, sys.argv[1:])
          for item in source.iterdir():
              name=item.name
              if name == 'dmf_pulse' or name.startswith('dmf_pulse-') or name.startswith('__editable__') or name == '_editable_impl_dmf_pulse.pth':
                  continue
              destination=target/name
              if item.is_dir(): shutil.copytree(item, destination, dirs_exist_ok=True)
              else: shutil.copy2(item, destination)
          PY
          /tmp/dmf-stage15-wheel/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/python - <<'PY'
          import sys, dmf_pulse
          assert '/home/runner/work/dmf-pulse' not in dmf_pulse.__file__
          assert not [p for p in sys.path if '/home/runner/work/dmf-pulse' in p]
          PY
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf --version
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank --help >/dev/null
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank validate >/dev/null
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank eo --input /tmp/rank015-inputs/eo.json >/dev/null
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank evaluate --input /tmp/rank015-inputs/service-request.json --artifact-root /tmp/rank015-artifacts >/dev/null
          env -u PYTHONPATH /tmp/dmf-stage15-wheel/bin/dmf rank compare --input /tmp/rank015-inputs/service-request.json >/dev/null

      - name: Commit and push exact final tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            evidence/tickets/RANK-015/CHECKPOINT_15_06.md \
            evidence/tickets/RANK-015/COMMAND_LEDGER.txt \
            evidence/tickets/RANK-015/FINAL_ACCEPTANCE.md \
            tickets/RANK-015/PROGRESS.md
          test -z "$(git diff --name-only)"
          git diff --cached --check
          actual_tree=$(git write-tree)
          test "$actual_tree" = "$EXPECTED_TREE"
          git config user.name 'Sebastian Greenhalgh'
          git config user.email 'seb.greenhalgh@outlook.com'
          git commit -m 'chore(rank): seal Stage 15 final review tree'
          git push origin HEAD:"$BRANCH"
          final_sha=$(git rev-parse HEAD)
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          test "$final_sha" = "$remote_sha"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          git branch -f stage15-final-bundle "$final_sha"
          git bundle create /tmp/dmf-pulse-stage15-final.bundle refs/heads/stage15-final-bundle

      - name: Upload exact final Git bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stage15-final-bundle-${{ github.run_id }}
          path: /tmp/dmf-pulse-stage15-final.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Report durable final publication
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 14 --body "STAGE15_FINAL_SEAL run_id=${GITHUB_RUN_ID} status=success final_sha=${{ steps.publish.outputs.final_sha }} tree_sha=${EXPECTED_TREE} checkpoint_15_06=${CHECKPOINT_1506} tests=243 raw_branch_coverage=91.334895 inherited=37 cleanup=PASS main=${IMMUTABLE_MAIN} artifact_id=${{ steps.upload.outputs.artifact-id }}"
