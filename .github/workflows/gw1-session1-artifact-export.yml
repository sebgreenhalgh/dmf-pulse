name: gw1-session1-artifact-export

on:
  push:
    branches:
      - readiness/GW1-2026-27-live-input-initial-squad
    paths:
      - .github/workflows/gw1-session1-artifact-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          archive=artifacts/gw1-session1-bootstrap/dmf-pulse-source.tar.gz
          expected=$(awk '{print $1}' artifacts/gw1-session1-bootstrap/dmf-pulse-source.tar.gz.sha256)
          test -s "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$expected"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmf-pulse-gw1-session1-source-${{ github.run_id }}
          path: |
            artifacts/gw1-session1-bootstrap/dmf-pulse-source.tar.gz
            artifacts/gw1-session1-bootstrap/dmf-pulse-source.tar.gz.sha256
            artifacts/gw1-session1-bootstrap/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Record run ID and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/gw1-session1-bootstrap/ARTIFACT_RUN_ID.txt
          rm -f .github/workflows/gw1-session1-artifact-export.yml
          git config user.name "dmf-pulse-gw1-session1-bot"
          git config user.email "dmf-pulse-gw1-session1-bot@users.noreply.github.com"
          git add -A
          git add -f artifacts/gw1-session1-bootstrap/ARTIFACT_RUN_ID.txt
          git commit -m "chore(gw1): record source artifact run"
          git push origin HEAD:refs/heads/readiness/GW1-2026-27-live-input-initial-squad
