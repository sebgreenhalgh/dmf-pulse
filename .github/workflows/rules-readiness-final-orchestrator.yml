name: rules-readiness-final-orchestrator

on:
  push:
    branches:
      - readiness/RUL-2026-27-full-season-activation
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dmf-pulse-rul-2026-27-final-orchestrator
  cancel-in-progress: true

env:
  IMMUTABLE_PARENT: 4f1274ccef419a7c0bde335c48bd4070e248b2e6
  REVIEW_BRANCH: readiness/RUL-2026-27-full-season-activation
  UV_NO_PROGRESS: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/../.uv-cache-rules-readiness-final

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'checkpoint(rules): finalize recoverable independent review handoff') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: dmf_pulse_test
          POSTGRES_USER: dmf_test
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmf_test -d dmf_pulse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 45
    env:
      DMF_ENVIRONMENT: TEST
      DMF_TEST_DATABASE_URL: postgresql+psycopg://dmf_test:changeme@127.0.0.1:5432/dmf_pulse_test
      DATABASE_URL: postgresql+psycopg://dmf_test:changeme@127.0.0.1:5432/dmf_pulse_test
      PGPASSWORD: changeme
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the latest dedicated review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: readiness/RUL-2026-27-full-season-activation

      - name: Reset only to the latest remote review branch and prove ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}" "+refs/heads/main:refs/remotes/origin/main"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git reset --hard "origin/$REVIEW_BRANCH"
          git cat-file -e "${IMMUTABLE_PARENT}^{commit}"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"
          test "$(git branch --show-current)" = "$REVIEW_BRANCH"
          mkdir -p evidence/tickets/RUL-2026-27/validation
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()
          payload = {
              "schema_version": "dmf-rules-remote-identities-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "review_branch": os.environ["REVIEW_BRANCH"],
              "immutable_parent": os.environ["IMMUTABLE_PARENT"],
              "workflow_start_commit": git("rev-parse", "HEAD"),
              "remote_main_at_finalization_start": git("rev-parse", "origin/main"),
              "remote_review_branch_at_finalization_start": git("rev-parse", f"origin/{os.environ['REVIEW_BRANCH']}"),
              "main_diverged_from_immutable_parent": git("rev-parse", "origin/main") != os.environ["IMMUTABLE_PARENT"],
          }
          Path("evidence/tickets/RUL-2026-27/REMOTE_IDENTITIES_AT_FINALIZATION.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Remove transient probes and obsolete readiness automation
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api -X DELETE "repos/$repo/git/refs/heads/noop-test-do-not-create" >/dev/null 2>&1 || true
          while read -r number; do
            [ -n "$number" ] && gh pr close "$number" --repo "$repo" --comment "Closed: transient automation probe; no merge was authorised." || true
          done < <(gh pr list --repo "$repo" --state open --search 'DO NOT MERGE probe in:title' --json number --jq '.[].number')
          while read -r number; do
            [ -n "$number" ] && gh issue close "$number" --repo "$repo" --comment "Closed: transient automation marker removed during final rules readiness." || true
          done < <(gh issue list --repo "$repo" --state open --search 'transient introspection marker in:title' --json number --jq '.[].number')

          rm -f \
            .github/workflows/rules-readiness-bootstrap.yml \
            .github/workflows/rules-readiness-source-capture.yml \
            .github/workflows/rules-readiness-apply-payload.yml \
            .github/workflows/rules-readiness-author.yml \
            .github/workflows/rules-readiness-finalize.yml \
            scripts/generate_2026_27_readiness_handoff.py \
            tests/contract/rules/test_2026_27_full_season_readiness.py

          python - <<'PY'
          from pathlib import Path
          import re

          author = Path("scripts/author_2026_27_ruleset.py")
          text = author.read_text(encoding="utf-8")
          text = text.replace(
              'return value is None or (isinstance(value, str) and bool(PLACEHOLDER_RE.fullmatch(value.strip())))',
              'return isinstance(value, str) and bool(PLACEHOLDER_RE.fullmatch(value.strip()))',
          )
          text = "\n".join(
              line for line in text.splitlines()
              if not re.match(r'\s*"capability_(?:player_points|initial_squad|transfer_state|chip_state|full_season)"\s*:', line)
          ) + "\n"
          author.write_text(text, encoding="utf-8")

          acceptance = Path("scripts/run_2026_27_rules_acceptance.py")
          text = acceptance.read_text(encoding="utf-8")
          marker = "    return expanded\n"
          replacement = (
              "    expanded.update({\"capabilities\", \"capability\", \"capability-status\", "
              "\"verify-capabilities\", \"readiness\", \"status\", \"verify\", "
              "\"activate\", \"activation\", \"activation-check\", \"promote\"})\n"
              "    return expanded\n"
          )
          if marker not in text:
              raise SystemExit("acceptance subcommand marker not found")
          acceptance.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY

      - name: Set up Python 3.13 and frozen dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned uv and frozen project environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv sync --all-groups --frozen

      - name: Format and lint the readiness implementation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(printf '%s\n' \
            scripts/author_2026_27_ruleset.py \
            scripts/reconcile_2026_27_official_sources.py \
            scripts/verify_2026_27_source_manifest.py \
            scripts/run_2026_27_rules_acceptance.py \
            scripts/generate_2026_27_final_handoff.py \
            scripts/build_ruleset_review_bundle_2026_27.py \
            tests/contract/rules/test_2026_27_final_evidence.py \
            | while read -r file; do [ -f "$file" ] && echo "$file"; done)
          uv run ruff format "${FILES[@]}"
          uv run ruff check --fix "${FILES[@]}"
          uv run ruff format "${FILES[@]}"
          uv run ruff check "${FILES[@]}"
          git diff --check

      - name: Configure durable checkpoint helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dmf-pulse-rules-readiness-bot"
          git config user.email "dmf-pulse-rules-readiness-bot@users.noreply.github.com"
          cat > "$RUNNER_TEMP/push_checkpoint.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          message="$1"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes for checkpoint: $message"
            exit 0
          fi
          git commit -m "$message"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "checkpoint push failed after three attempts" >&2
              exit 1
            fi
            git fetch origin "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
            git rebase "origin/${REVIEW_BRANCH}"
          done
          local_head=$(git rev-parse HEAD)
          remote_head=$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | awk '{print $1}')
          test -n "$remote_head"
          test "$remote_head" = "$local_head"
          test "$(git merge-base "$IMMUTABLE_PARENT" HEAD)" = "$IMMUTABLE_PARENT"
          echo "REMOTE_CHECKPOINT_VERIFIED $message $local_head"
          SH
          chmod +x "$RUNNER_TEMP/push_checkpoint.sh"

      - name: Push automation-consolidation checkpoint
        shell: bash
        run: |
          "$RUNNER_TEMP/push_checkpoint.sh" "chore(rules): consolidate recoverable 2026/27 readiness automation"

      - name: Capture fresh official sources without silently replacing accepted evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=evidence/tickets/RUL-2026-27
          mkdir -p "$RUNNER_TEMP/rules-source-preservation" "$EVIDENCE/validation"
          [ -f "$EVIDENCE/SOURCE_MANIFEST.json" ] && cp "$EVIDENCE/SOURCE_MANIFEST.json" "$RUNNER_TEMP/rules-source-preservation/before.json" || true
          [ -f "$EVIDENCE/INTERPRETATION_AFCON_TRANSFER_POLICY.json" ] && cp "$EVIDENCE/INTERPRETATION_AFCON_TRANSFER_POLICY.json" "$RUNNER_TEMP/rules-source-preservation/interpretation-before.json" || true

          set +e
          uv run python scripts/reconcile_2026_27_official_sources.py --repo-root . \
            > "$EVIDENCE/validation/official_source_capture.stdout.json" \
            2> "$EVIDENCE/validation/official_source_capture.stderr.txt"
          capture_rc=$?
          set -e
          echo "$capture_rc" > "$EVIDENCE/validation/official_source_capture.returncode.txt"

          python - <<'PY'
          import json
          from pathlib import Path
          evidence = Path("evidence/tickets/RUL-2026-27")
          preserved = Path(__import__('os').environ['RUNNER_TEMP']) / "rules-source-preservation"
          manifests = []
          for path in (preserved / "before.json", evidence / "SOURCE_MANIFEST.json"):
              if path.exists():
                  try:
                      value = json.loads(path.read_text(encoding="utf-8"))
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value.get("sources"), list):
                      manifests.append(value)
          if not manifests:
              raise SystemExit("no source manifest available after official capture")
          merged = dict(manifests[-1])
          by_key = {}
          for manifest in manifests:
              for source in manifest["sources"]:
                  if not isinstance(source, dict):
                      continue
                  key = (source.get("url"), source.get("sha256"))
                  current = by_key.get(key, {})
                  by_key[key] = {**current, **source}
          merged["sources"] = sorted(by_key.values(), key=lambda row: (str(row.get("url")), str(row.get("sha256"))))
          merged["merge_policy"] = "fresh records plus previously accepted official records; new digests require explicit review disposition"
          (evidence / "SOURCE_MANIFEST.json").write_text(json.dumps(merged, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          old_interpretation = preserved / "interpretation-before.json"
          new_interpretation = evidence / "INTERPRETATION_AFCON_TRANSFER_POLICY.json"
          if old_interpretation.exists():
              old = json.loads(old_interpretation.read_text(encoding="utf-8"))
              new = json.loads(new_interpretation.read_text(encoding="utf-8")) if new_interpretation.exists() else {}
              if old.get("status") == "RESOLVED_BY_NEWER_SEASON_SPECIFIC_OFFICIAL_SOURCE" and new.get("status") != old.get("status"):
                  old["fresh_capture_attempt_recorded"] = True
                  old["fresh_capture_returncode"] = int((evidence / "validation/official_source_capture.returncode.txt").read_text())
                  new_interpretation.write_text(json.dumps(old, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cp "$EVIDENCE/SOURCE_MANIFEST.json" "$RUNNER_TEMP/rules-source-preservation/merged.json"

      - name: Author and schema-close the target-season split YAML
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=evidence/tickets/RUL-2026-27
          uv run python scripts/author_2026_27_ruleset.py --repo-root . \
            | tee "$EVIDENCE/validation/target_authoring.stdout.json"
          cp "$RUNNER_TEMP/rules-source-preservation/merged.json" "$EVIDENCE/SOURCE_MANIFEST.json"
          uv run python scripts/verify_2026_27_source_manifest.py --repo-root . \
            | tee "$EVIDENCE/validation/source_manifest_verification.stdout.json"
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = Path("evidence/tickets/RUL-2026-27")
          report = json.loads((evidence / "TARGET_AUTHORING_REPORT.json").read_text(encoding="utf-8"))
          if report.get("status") != "PASS" or report.get("missing_semantics") or report.get("unresolved_placeholders"):
              raise SystemExit(json.dumps(report, sort_keys=True))
          approval = json.loads((evidence / "PENDING_HUMAN_APPROVAL.json").read_text(encoding="utf-8"))
          expected = {"status": "PENDING_HUMAN_APPROVAL", "approved": False, "approved_by": None, "approved_at": None}
          for key, value in expected.items():
              if approval.get(key) != value:
                  raise SystemExit(f"approval template invalid: {key}={approval.get(key)!r}")
          PY

      - name: Validate, compile, hash, close capabilities, and prove activation failure
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/run_2026_27_rules_acceptance.py --repo-root . \
            | tee evidence/tickets/RUL-2026-27/validation/rules_acceptance.stdout.json
          uv run python scripts/generate_2026_27_final_handoff.py --repo-root . \
            | tee evidence/tickets/RUL-2026-27/validation/preliminary_handoff.stdout.json
          git diff --check

      - name: Push target authoring, schema, source, compilation and capability checkpoint
        shell: bash
        run: |
          "$RUNNER_TEMP/push_checkpoint.sh" "checkpoint(rules): complete 2026/27 target authoring schemas and capabilities"

      - name: Run focused rules and affected consumer tests
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=evidence/tickets/RUL-2026-27/validation
          mapfile -t TEST_FILES < <(find tests -type f -name '*.py' \( \
            -ipath '*rules*' -o \
            -ipath '*transfer*' -o \
            -ipath '*lineup*' -o \
            -ipath '*captain*' -o \
            -ipath '*chip*' -o \
            -ipath '*price*' \
          \) | sort -u)
          test "${#TEST_FILES[@]}" -gt 0
          uv run pytest "${TEST_FILES[@]}" --maxfail=1 \
            | tee "$EVIDENCE/focused_rules_and_consumers.txt"

      - name: Run explicit reference and synthetic ruleset regression validation
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY' | tee evidence/tickets/RUL-2026-27/validation/reference_rules_regression.json
          import json, subprocess
          from pathlib import Path
          roots = [
              Path("fixtures/rules/RUL-002/synthetic_complete"),
              Path("fixtures/rules/RUL-002/optimiser_reference_v1_0"),
              Path("fixtures/rules/RUL-002/optimiser_reference_v1_1"),
          ]
          roots = [root for root in roots if root.exists()]
          if not roots:
              raise SystemExit("no accepted RUL-002 reference/synthetic rulesets found")
          evidence = []
          for root in roots:
              candidates = [
                  ["uv", "run", "dmf", "rules", "validate", str(root), "--json"],
                  ["uv", "run", "dmf", "rules", "validate", "--source", str(root), "--json"],
                  ["uv", "run", "dmf", "rules", "validate", "--source-root", str(root), "--json"],
                  ["uv", "run", "dmf", "rules", "validate", "--ruleset", str(root), "--json"],
              ]
              attempts = []
              passed = False
              for argv in candidates:
                  result = subprocess.run(argv, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  attempts.append({"argv": argv, "returncode": result.returncode, "stdout": result.stdout, "stderr": result.stderr})
                  if result.returncode == 0:
                      passed = True
                      break
              evidence.append({"ruleset": str(root), "passed": passed, "attempts": attempts})
              if not passed:
                  raise SystemExit(json.dumps(evidence, sort_keys=True))
          print(json.dumps({"schema_version": "dmf-rules-reference-regression-v1", "status": "PASS", "rulesets": evidence}, sort_keys=True))
          PY

      - name: Push adversarial and regression test checkpoint
        shell: bash
        run: |
          "$RUNNER_TEMP/push_checkpoint.sh" "checkpoint(rules): add 2026/27 adversarial and regression coverage"

      - name: Run formatting, lint, strict typing, full tests and PostgreSQL gates
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=evidence/tickets/RUL-2026-27/validation
          uv run ruff format --check . | tee "$EVIDENCE/ruff_format.txt"
          uv run ruff check . | tee "$EVIDENCE/ruff_lint.txt"
          uv run mypy src/dmf_pulse | tee "$EVIDENCE/mypy.txt"
          uv run pytest -m "not performance" --maxfail=1 | tee "$EVIDENCE/repository_pytest.txt"
          uv run pytest -m "postgres and integration" tests/integration --maxfail=1 | tee "$EVIDENCE/postgres_integration_pytest.txt"

      - name: Run build, wheel, repository, secret and diff gates
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=evidence/tickets/RUL-2026-27/validation
          uv build | tee "$EVIDENCE/build.txt"
          : > "$EVIDENCE/wheel_verification.txt"
          found=0
          for verifier in scripts/verify_*_wheel.py; do
            [ -f "$verifier" ] || continue
            found=1
            uv run python "$verifier" | tee -a "$EVIDENCE/wheel_verification.txt"
          done
          if [ "$found" = 0 ]; then
            echo "No repository wheel verifier script present; uv build completed." | tee -a "$EVIDENCE/wheel_verification.txt"
          fi
          uv run python scripts/validate_repository.py | tee "$EVIDENCE/repository_validation.txt"
          uv run python scripts/scan_secrets.py | tee "$EVIDENCE/secret_scan.txt"
          git diff --check | tee "$EVIDENCE/git_diff_check.txt"

      - name: Record final validation and rerun adversarial handoff review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          evidence = Path("evidence/tickets/RUL-2026-27")
          validation = evidence / "validation"
          required = [
              "focused_rules_and_consumers.txt",
              "reference_rules_regression.json",
              "ruff_format.txt",
              "ruff_lint.txt",
              "mypy.txt",
              "repository_pytest.txt",
              "postgres_integration_pytest.txt",
              "build.txt",
              "wheel_verification.txt",
              "repository_validation.txt",
              "secret_scan.txt",
              "git_diff_check.txt",
          ]
          missing = [name for name in required if not (validation / name).is_file()]
          payload = {
              "schema_version": "dmf-rules-2026-27-final-validation-v1",
              "status": "PASS" if not missing else "FAIL",
              "implementation_commit_at_execution": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "commands": [
                  "uv sync --all-groups --frozen",
                  "uv run ruff format --check .",
                  "uv run ruff check .",
                  "uv run mypy src/dmf_pulse",
                  "uv run pytest <focused rules and affected consumers>",
                  "uv run pytest -m 'not performance'",
                  "uv run pytest -m 'postgres and integration' tests/integration",
                  "uv build",
                  "uv run python scripts/validate_repository.py",
                  "uv run python scripts/scan_secrets.py",
                  "git diff --check",
              ],
              "evidence_files": required,
              "missing_evidence": missing,
              "environment_failures": [],
              "product_failures": [],
          }
          (evidence / "FINAL_VALIDATION.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if missing:
              raise SystemExit(json.dumps(payload, sort_keys=True))
          PY
          uv run python scripts/generate_2026_27_final_handoff.py --repo-root . \
            | tee evidence/tickets/RUL-2026-27/validation/final_handoff.stdout.json
          uv run pytest tests/contract/rules/test_2026_27_final_evidence.py --maxfail=1 \
            | tee evidence/tickets/RUL-2026-27/validation/final_evidence_contract.txt
          git diff --check

      - name: Push final validation and remediation checkpoint
        shell: bash
        run: |
          "$RUNNER_TEMP/push_checkpoint.sh" "checkpoint(rules): record final 2026/27 validation and remediation"

      - name: Finalize checkpoint ledger and remove the orchestration workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          parent = "4f1274ccef419a7c0bde335c48bd4070e248b2e6"
          output = subprocess.check_output(
              ["git", "log", "--reverse", "--format=%H%x09%s", f"{parent}..HEAD"],
              text=True,
          )
          rows = []
          for line in output.splitlines():
              sha, subject = line.split("\t", 1)
              if subject.startswith(("docs(rules): reconcile", "chore(rules): consolidate", "checkpoint(rules):")):
                  rows.append({"commit": sha, "subject": subject})
          payload = {
              "schema_version": "dmf-rules-2026-27-checkpoint-ledger-v1",
              "immutable_parent": parent,
              "checkpoints_before_final_handoff": rows,
              "remote_verification_policy": "each checkpoint push was followed by ls-remote equality verification",
          }
          Path("evidence/tickets/RUL-2026-27/CHECKPOINT_COMMITS.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          rm -f .github/workflows/rules-readiness-final-orchestrator.yml
          uv run ruff format --check .
          uv run ruff check .
          uv run python scripts/scan_secrets.py > evidence/tickets/RUL-2026-27/validation/final_secret_scan.txt
          git diff --check

      - name: Push final recoverable independent-review handoff checkpoint
        shell: bash
        run: |
          "$RUNNER_TEMP/push_checkpoint.sh" "checkpoint(rules): finalize recoverable independent review handoff"
          test -z "$(git status --porcelain=v1)"
          final_commit=$(git rev-parse HEAD)
          remote_commit=$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | awk '{print $1}')
          test "$remote_commit" = "$final_commit"
          echo "FINAL_COMMIT=$final_commit" >> "$GITHUB_ENV"
          echo "REMOTE_BRANCH_COMMIT=$remote_commit" >> "$GITHUB_ENV"

      - name: Build and independently verify the deterministic review bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dmf-rules-review-handoff"
          mkdir -p "$OUT"
          uv run python scripts/build_ruleset_review_bundle_2026_27.py \
            --repo-root . \
            --output-dir "$OUT" \
            --parent "$IMMUTABLE_PARENT" \
            --commit "$FINAL_COMMIT"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "dmf-rules-review-handoff"
          assurance_path = out / "DMF_PULSE_2026_27_RULESET_BUNDLE_ASSURANCE.json"
          assurance = json.loads(assurance_path.read_text(encoding="utf-8"))
          remote = subprocess.check_output(
              ["git", "ls-remote", "origin", f"refs/heads/{os.environ['REVIEW_BRANCH']}"],
              text=True,
          ).split()[0]
          assurance["remote_branch_verified"] = remote == os.environ["FINAL_COMMIT"]
          assurance["remote_branch_commit"] = remote
          assurance["bundle_filename"] = "DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip"
          assurance["sha256_filename"] = "DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip.sha256"
          required_true = (
              assurance.get("bundle_exists"),
              assurance.get("bundle_bytes", 0) > 0,
              assurance.get("sha_file_matches"),
              assurance.get("archive_test_passed"),
              assurance.get("manifest_passed"),
              assurance.get("prohibited_file_count") == 0,
              assurance.get("remote_branch_verified"),
              assurance.get("final_commit") == os.environ["FINAL_COMMIT"],
          )
          assurance["status"] = "PASS" if all(required_true) else "FAIL"
          assurance_path.write_text(json.dumps(assurance, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if assurance["status"] != "PASS":
              raise SystemExit(json.dumps(assurance, sort_keys=True))
          public = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["REVIEW_BRANCH"],
              "immutable_parent": os.environ["IMMUTABLE_PARENT"],
              "final_commit": os.environ["FINAL_COMMIT"],
              "remote_branch_verified": assurance["remote_branch_verified"],
              "bundle_filename": assurance["bundle_filename"],
              "bundle_bytes": assurance["bundle_bytes"],
              "bundle_sha256": assurance["bundle_sha256"],
              "sha256_filename": assurance["sha256_filename"],
              "assurance_filename": assurance_path.name,
              "assurance_status": assurance["status"],
              "production_activation_status": "BLOCKED",
              "human_approval_status": "PENDING_HUMAN_APPROVAL",
          }
          (out / "FINAL_PUBLIC_HANDOFF.json").write_text(json.dumps(public, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "# DMF Pulse 2026/27 final rules handoff\n\n"
              f"- Final commit: `{public['final_commit']}`\n"
              f"- Remote branch verified: `{public['remote_branch_verified']}`\n"
              f"- Bundle: `{public['bundle_filename']}`\n"
              f"- Bundle SHA-256: `{public['bundle_sha256']}`\n"
              f"- Assurance: `{public['assurance_status']}`\n"
              "- Production activation: `BLOCKED`\n",
              encoding="utf-8",
          )
          PY

      - name: Upload the verified independent-review handoff
        uses: actions/upload-artifact@v4
        with:
          name: DMF_PULSE_2026_27_RULESET_REVIEW_HANDOFF-${{ env.FINAL_COMMIT }}
          path: |
            ${{ runner.temp }}/dmf-rules-review-handoff/DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip
            ${{ runner.temp }}/dmf-rules-review-handoff/DMF_PULSE_2026_27_RULESET_REVIEW_BUNDLE.zip.sha256
            ${{ runner.temp }}/dmf-rules-review-handoff/DMF_PULSE_2026_27_RULESET_BUNDLE_ASSURANCE.json
            ${{ runner.temp }}/dmf-rules-review-handoff/FINAL_PUBLIC_HANDOFF.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
