name: gw1-checkpoint-1-3c-attest

on:
  push:
    branches:
      - readiness/GW1-2026-27-live-input-initial-squad
    paths:
      - .github/workflows/gw1-checkpoint-1-3c-attest.yml

permissions:
  contents: write

concurrency:
  group: gw1-checkpoint-1-3c-attest
  cancel-in-progress: true

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: "1"
      PYTHONUTF8: "1"
      ACCEPTANCE_SHA: "a2f823ab53cec944e8bb7065d40b4950f7d11c9b"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Attest exact Checkpoint 1.3C publication
        shell: bash
        run: |
          set -euo pipefail
          probe='evidence/readiness/.GW1_SESSION1_1_3C_ATTESTATION_PROBE'
          workflow='.github/workflows/gw1-checkpoint-1-3c-attest.yml'

          test "$(git rev-parse HEAD^^)" = "$ACCEPTANCE_SHA"
          test "$(git show -s --format=%s "$ACCEPTANCE_SHA")" = 'docs(gw1): complete live odds input acceptance'

          python - "$ACCEPTANCE_SHA" <<'PY'
          from pathlib import Path
          import sys

          acceptance_sha = sys.argv[1]
          needle = "pending exact-SHA attestation"
          for name in (
              "evidence/readiness/GW1_SESSION1_VALIDATION_1_3C.md",
              "evidence/readiness/GW1_SESSION1_PROGRESS.md",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(needle) != 1:
                  raise SystemExit(f"unexpected attestation marker count in {name}")
              path.write_text(text.replace(needle, f"`{acceptance_sha}`"), encoding="utf-8")
          PY

          rm -f "$probe" "$workflow"
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv sync --all-groups --frozen
          uv run python scripts/scan_secrets.py > "${RUNNER_TEMP}/secret-scan.json"
          python - "${RUNNER_TEMP}/secret-scan.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["finding_count"] == 0
          assert result["status"] == "PASS"
          PY
          git diff --check

          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'dmf-pulse-gw1-acceptance-bot'
          git config user.email 'dmf-pulse-gw1-acceptance-bot@users.noreply.github.com'
          git add -A -- \
            evidence/readiness/GW1_SESSION1_VALIDATION_1_3C.md \
            evidence/readiness/GW1_SESSION1_PROGRESS.md \
            "$probe" \
            "$workflow"
          git commit -m 'checkpoint(gw1): attest final 1.3C validation publication'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
