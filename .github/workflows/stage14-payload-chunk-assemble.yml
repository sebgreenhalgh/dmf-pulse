name: stage14-payload-chunk-assemble

on:
  push:
    branches:
      - stage/A14/CHIP-014-chip-optimisation
    paths:
      - recovery/stage14-payload-ready.txt

permissions:
  contents: write

concurrency:
  group: stage14-payload-chunk-assemble
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical Stage 14 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode payload and publish transport trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          parts = sorted(Path("recovery").glob("stage14-payload.part-*"))
          if not parts:
              raise SystemExit("no Stage 14 payload chunks found")
          encoded = "".join(path.read_text(encoding="utf-8") for path in parts)
          decoded = gzip.decompress(base64.b64decode(encoded))
          Path("recovery/stage14-checkpoint.json").write_bytes(decoded)
          for path in parts:
              path.unlink()
          Path("recovery/stage14-payload-ready.txt").unlink()
          Path(".github/workflows/stage14-payload-chunk-assemble.yml").unlink()
          PY
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "checkpoint(chips): assemble Stage 14 payload"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:stage/A14/CHIP-014-chip-optimisation; then
              exit 0
            fi
            if [[ "$attempt" == 5 ]]; then
              exit 1
            fi
            git fetch --no-tags origin stage/A14/CHIP-014-chip-optimisation:refs/remotes/origin/stage/A14/CHIP-014-chip-optimisation
            git rebase refs/remotes/origin/stage/A14/CHIP-014-chip-optimisation
          done
